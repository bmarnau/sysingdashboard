name: AQGS Pilot Format

on:
  push:
    branches:
      - "aqgs-pilot"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format AQGS pilot documentation
        run: bunx prettier --write docs/AQGS-PILOT-2026-09-18.md
      - name: Remove temporary formatter workflow
        run: rm .github/workflows/aqgs-pilot-format.yml
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AQGS-PILOT-2026-09-18.md .github/workflows/aqgs-pilot-format.yml
          git diff --cached --quiet && exit 0
          git commit -m "style(docs): format AQGS pilot"
          git push origin HEAD:aqgs-pilot
