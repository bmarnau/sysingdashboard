name: BSF02 Foundation Format Probe

on:
  push:
    branches:
      - feat/bsf-02-domain-scope-foundation-2026-08-25

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Show exact Prettier diff
        run: |
          bunx prettier --write src/lib/customer-data/migration.ts src/__tests__/lib/customer-data-migration.test.ts
          git diff -- src/lib/customer-data/migration.ts src/__tests__/lib/customer-data-migration.test.ts
