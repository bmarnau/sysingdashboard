name: BSF03B Format Diagnostic

on:
  push:
    branches:
      - feat/bsf-03b-performance-statement

permissions:
  contents: read

env:
  BUN_VERSION: latest

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Show canonical Prettier diff
        run: |
          bunx prettier --write             src/__tests__/integration/performance-statement-adapter.test.ts             src/integrations/supabase/performance-statement-adapter.ts
          git diff --             src/__tests__/integration/performance-statement-adapter.test.ts             src/integrations/supabase/performance-statement-adapter.ts
