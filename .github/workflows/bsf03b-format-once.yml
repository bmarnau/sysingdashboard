name: BSF03B Format Once

on:
  push:
    branches:
      - feat/bsf-03b-performance-statement

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf-03b-performance-statement
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format closure docs
        run: |
          bunx prettier --write             docs/BSF-03B-CLOSURE-2026-09-21.md             docs/BSF-03B-VERIFICATION-2026-09-21.md             docs/superpowers/plans/2026-09-14-bsf-03b-performance-statement.md
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docs/BSF-03B-CLOSURE-2026-09-21.md             docs/BSF-03B-VERIFICATION-2026-09-21.md             docs/superpowers/plans/2026-09-14-bsf-03b-performance-statement.md
          git commit -m "style(bsf03b): Abschlussdokumente formatieren"
          git push origin HEAD:feat/bsf-03b-performance-statement
