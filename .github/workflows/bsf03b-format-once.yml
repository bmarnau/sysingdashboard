name: Temporary BSF-03B formatter

on:
  push:
    branches:
      - feat/bsf-03b-performance-statement
    paths:
      - ".github/workflows/bsf03b-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf-03b-performance-statement
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format exact CI-reported files
        run: |
          bunx prettier --write \
            docs/DATA-SCHEMA.md \
            src/__tests__/backend/performance-statement.functions.test.ts \
            src/__tests__/components/PerformanceStatementView.test.tsx \
            src/__tests__/integration/performance-statement-adapter.test.ts \
            src/__tests__/io/performance-statement-export.test.ts \
            src/components/performance-statement/PerformanceStatementView.tsx \
            src/lib/backup/integrity.ts \
            src/lib/backup/performance-statement-payload.ts \
            src/lib/backup/restore.ts \
            src/lib/backup/snapshot.ts \
            src/lib/performance-statement-runtime/performance-statement.functions.ts \
            src/routes/_authenticated/leistungsnachweis.tsx
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/DATA-SCHEMA.md \
            src/__tests__/backend/performance-statement.functions.test.ts \
            src/__tests__/components/PerformanceStatementView.test.tsx \
            src/__tests__/integration/performance-statement-adapter.test.ts \
            src/__tests__/io/performance-statement-export.test.ts \
            src/components/performance-statement/PerformanceStatementView.tsx \
            src/lib/backup/integrity.ts \
            src/lib/backup/performance-statement-payload.ts \
            src/lib/backup/restore.ts \
            src/lib/backup/snapshot.ts \
            src/lib/performance-statement-runtime/performance-statement.functions.ts \
            src/routes/_authenticated/leistungsnachweis.tsx
          git diff --cached --quiet && exit 0
          git commit -m "style(bsf03b): CI-formatierte Dateien normalisieren"
          git push origin HEAD:feat/bsf-03b-performance-statement
