name: BSF03D Fix D12 Test

on:
  push:
    branches:
      - feat/bsf03d-workpackage-categories
    paths:
      - .github/workflows/bsf03d-fix-d12-test.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf03d-workpackage-categories
          fetch-depth: 0
      - name: Replace D12 with RLS zero-row assertion
        shell: python
        run: |
          from pathlib import Path
          path = Path('supabase/tests/bsf-03d-workpackage-category-scope.sql')
          text = path.read_text(encoding='utf-8')
          old = """-- D12: Leser ohne referencedata.manage darf nicht schreiben.\nSELECT pg_temp.act_as('00000000-0000-0000-0000-00000000e302');\nSELECT pg_temp.assert_denied(\n  $$UPDATE public.reference_value\n      SET label='Nicht erlaubt', updated_by='00000000-0000-0000-0000-00000000e302'\n    WHERE id='00000000-0000-0000-0000-0000000ce301'$$,\n  '42501','D12 reader update denied'\n);\nSELECT pg_temp.act_reset();\n"""
          new = """-- D12: UPDATE-RLS filtert den Datensatz aus; korrekt ist 0 Rows Changed.\nSELECT pg_temp.act_as('00000000-0000-0000-0000-00000000e302');\nUPDATE public.reference_value\n   SET label='Nicht erlaubt', updated_by='00000000-0000-0000-0000-00000000e302'\n WHERE id='00000000-0000-0000-0000-0000000ce301';\nSELECT pg_temp.assert(\n  NOT EXISTS (\n    SELECT 1 FROM public.reference_value\n     WHERE id='00000000-0000-0000-0000-0000000ce301'\n       AND label='Nicht erlaubt'\n  ),\n  'D12 reader update denied by RLS zero-row filter'\n);\nSELECT pg_temp.act_reset();\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one D12 block, got {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
      - name: Remove one-shot workflow
        run: rm .github/workflows/bsf03d-fix-d12-test.yml
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(bsf03d): RLS-Update-DENY korrekt prüfen"
          git push origin HEAD:feat/bsf03d-workpackage-categories
