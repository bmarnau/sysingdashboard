name: BSF03D Generate Migration

on:
  push:
    branches:
      - feat/bsf03d-workpackage-categories
    paths:
      - .github/workflows/bsf03d-generate-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/bsf03d-workpackage-categories
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate migration with pinned Supabase CLI
        run: npx --yes supabase@2.117.0 migration new bsf03d_reference_data_systemhouse_scope

      - name: Verify exactly one migration was generated
        shell: bash
        run: |
          set -euo pipefail
          count=$(find supabase/migrations -maxdepth 1 -type f -name '*_bsf03d_reference_data_systemhouse_scope.sql' | wc -l)
          test "$count" -eq 1
          find supabase/migrations -maxdepth 1 -type f -name '*_bsf03d_reference_data_systemhouse_scope.sql' -print

      - name: Remove one-shot workflow
        run: rm .github/workflows/bsf03d-generate-migration.yml

      - name: Commit generated migration and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(bsf03d): Supabase-Migration CLI-generiert anlegen"
          git push origin HEAD:feat/bsf03d-workpackage-categories
