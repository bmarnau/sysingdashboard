name: BSF03D GREEN WorkPackage Category

on:
  push:
    branches:
      - feat/bsf03d-workpackage-categories
    paths:
      - .github/workflows/bsf03d-green-workpackage-category.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf03d-workpackage-categories
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - run: bun install --frozen-lockfile
      - name: WorkPackage category tests
        id: tests
        continue-on-error: true
        run: bunx vitest run src/__tests__/lib/reference-data/workpackage-category.test.ts
      - name: TypeScript typecheck
        id: types
        continue-on-error: true
        run: bun run typecheck
      - name: Remove one-shot workflow
        if: always()
        run: rm .github/workflows/bsf03d-green-workpackage-category.yml
      - name: Commit cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(bsf03d): WorkPackage-GREEN-Workflow entfernen"
          git push origin HEAD:feat/bsf03d-workpackage-categories
      - name: Assert GREEN
        if: always()
        shell: bash
        run: |
          echo "tests=${{ steps.tests.outcome }} types=${{ steps.types.outcome }}"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.types.outcome }}" = "success"
