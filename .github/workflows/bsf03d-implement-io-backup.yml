name: BSF03D Implement IO Backup

on:
  push:
    branches:
      - feat/bsf03d-workpackage-categories
    paths:
      - .github/workflows/bsf03d-implement-io-backup.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf03d-workpackage-categories
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - run: bun install --frozen-lockfile
      - name: Apply deterministic IO and backup changes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_str: str, old: str, new: str, label: str):
              path = Path(path_str)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'src/lib/json-schema.ts',
              '''  priority: z.string().max(SHORT_STR),\n  due: z.string().max(64).optional(),\n''',
              '''  priority: z.string().max(SHORT_STR),\n  categoryKey: z.string().max(SHORT_STR).nullable().optional(),\n  categoryLabel: z.string().max(SHORT_STR).nullable().optional(),\n  due: z.string().max(64).optional(),\n''',
              'WorkPackageSchema category fields',
          )

          replace_once(
              'src/lib/json-schema.ts',
              '''  validFrom: z.string().max(64),\n  validTo: z.string().max(64).nullable(),\n});\n\nexport const AvkkExportSchema = z.object({\n''',
              '''  validFrom: z.string().max(64),\n  validTo: z.string().max(64).nullable(),\n  systemhouseId: z.string().max(SHORT_ID).nullable().optional(),\n});\n\nexport const AvkkExportSchema = z.object({\n''',
              'ReferenceValueExportSchema systemhouseId',
          )

          replace_once(
              'src/lib/json-import-service.ts',
              '''import { dashboardData, type Activity, type Project, type WorkPackage } from "@/lib/dashboard-data";\nimport { isSensitiveFieldName } from "@/lib/json-schema";\n''',
              '''import { dashboardData, type Activity, type Project, type WorkPackage } from "@/lib/dashboard-data";\nimport type { ReferenceValue } from "@/lib/reference-data";\nimport { isSensitiveFieldName } from "@/lib/json-schema";\n''',
              'Import ReferenceValue type',
          )

          replace_once(
              'src/lib/json-import-service.ts',
              '''  /** Filtert Scopes auf eine Whitelist (z. B. nur "projects"). */\n  scopeWhitelist?: ReadonlyArray<keyof DashboardJsonExport>;\n}\n''',
              '''  /** Filtert Scopes auf eine Whitelist (z. B. nur "projects"). */\n  scopeWhitelist?: ReadonlyArray<keyof DashboardJsonExport>;\n  /** Ziel-Scope zur fail-safe Validierung optionaler AP-Kategorien. */\n  workPackageCategoryContext?: {\n    systemhouseId: string;\n    values: readonly ReferenceValue[];\n  };\n}\n''',
              'ImportOptions category context',
          )

          replace_once(
              'src/lib/json-import-service.ts',
              '''  timeEntryConflicts: Array<{\n    activityId: string;\n    field: string;\n    activityValue: unknown;\n    timeEntryValue: unknown;\n  }>;\n}\n''',
              '''  timeEntryConflicts: Array<{\n    activityId: string;\n    field: string;\n    activityValue: unknown;\n    timeEntryValue: unknown;\n  }>;\n  /** Kategorien werden nie still umgedeutet; problematische Keys bleiben Snapshot + Warnung. */\n  categoryWarnings: Array<{\n    workPackageId: string;\n    categoryKey: string;\n    reason: "unknown" | "inactive" | "foreign" | "unvalidated";\n  }>;\n}\n''',
              'ImportPlan categoryWarnings',
          )

          replace_once(
              'src/lib/json-import-service.ts',
              '''      status: w.status as WorkPackage["status"],\n      priority: w.priority as WorkPackage["priority"],\n      due: w.due,\n''',
              '''      status: w.status as WorkPackage["status"],\n      priority: w.priority as WorkPackage["priority"],\n      categoryKey: w.categoryKey ?? null,\n      categoryLabel: w.categoryKey ? (w.categoryLabel ?? w.categoryKey) : null,\n      due: w.due,\n''',
              'Import WorkPackage category mapping',
          )

          replace_once(
              'src/lib/json-import-service.ts',
              '''    const targetsIn: EngineerTargetTimeModel[] = (doc.targetTimeModels ?? []).map((t) => ({\n''',
              '''    const categoryWarnings: ImportPlan["categoryWarnings"] = [];\n    const categoryContext = options.workPackageCategoryContext;\n    for (const workPackage of wpsIn) {\n      const categoryKey = workPackage.categoryKey?.trim();\n      if (!categoryKey) continue;\n      if (!categoryContext) {\n        categoryWarnings.push({ workPackageId: workPackage.id, categoryKey, reason: "unvalidated" });\n        continue;\n      }\n      const matchingTarget = categoryContext.values.find(\n        (value) =>\n          value.catalogKey === "workpackage.category" &&\n          value.key === categoryKey &&\n          value.systemhouseId === categoryContext.systemhouseId,\n      );\n      if (matchingTarget) {\n        if (!matchingTarget.isActive) {\n          categoryWarnings.push({ workPackageId: workPackage.id, categoryKey, reason: "inactive" });\n        }\n        continue;\n      }\n      const sameKeyForeignScope = categoryContext.values.some(\n        (value) =>\n          value.catalogKey === "workpackage.category" &&\n          value.key === categoryKey &&\n          value.systemhouseId !== null &&\n          value.systemhouseId !== categoryContext.systemhouseId,\n      );\n      categoryWarnings.push({\n        workPackageId: workPackage.id,\n        categoryKey,\n        reason: sameKeyForeignScope ? "foreign" : "unknown",\n      });\n    }\n\n    const targetsIn: EngineerTargetTimeModel[] = (doc.targetTimeModels ?? []).map((t) => ({\n''',
              'category warning calculation',
          )

          replace_once(
              'src/lib/json-import-service.ts',
              '''      timeEntryConflicts,\n    };\n''',
              '''      timeEntryConflicts,\n      categoryWarnings,\n    };\n''',
              'categoryWarnings return',
          )

          replace_once(
              'src/lib/json-import-service.ts',
              '''      if (plan.customerSuggestions.length > 0 && !options.customerMapping) {\n        warnings.push(\n          `${plan.customerSuggestions.length} mögliche Kunden-Duplikate wurden nicht gemappt — verbleiben als eigenständige Kunden.`,\n        );\n      }\n\n      logger.info("JsonImport applied", {\n''',
              '''      if (plan.customerSuggestions.length > 0 && !options.customerMapping) {\n        warnings.push(\n          `${plan.customerSuggestions.length} mögliche Kunden-Duplikate wurden nicht gemappt — verbleiben als eigenständige Kunden.`,\n        );\n      }\n      for (const categoryWarning of plan.categoryWarnings) {\n        warnings.push(\n          `Arbeitspaket ${categoryWarning.workPackageId}: Kategorie ${categoryWarning.categoryKey} wurde als ${categoryWarning.reason} erkannt und nicht still umgedeutet.`,\n        );\n      }\n\n      logger.info("JsonImport applied", {\n''',
              'category warnings apply result',
          )

          replace_once(
              'src/lib/backup/avkk-payload.ts',
              '''    version: number;\n    isSystem: boolean;\n  }>;\n''',
              '''    version: number;\n    isSystem: boolean;\n    scopeType: "global" | "systemhouse";\n  }>;\n''',
              'ReferenceDataset catalog scopeType',
          )

          replace_once(
              'src/lib/backup/avkk-payload.ts',
              '''    validFrom: string;\n    validTo: string | null;\n  }>;\n''',
              '''    validFrom: string;\n    validTo: string | null;\n    systemhouseId: string | null;\n  }>;\n''',
              'ReferenceDataset value systemhouseId',
          )

          replace_once(
              'src/lib/backup/avkk-payload.ts',
              '''        isSystem: c.isSystem,\n      })),\n''',
              '''        isSystem: c.isSystem,\n        scopeType: c.scopeType,\n      })),\n''',
              'collect catalog scopeType',
          )

          replace_once(
              'src/lib/backup/avkk-payload.ts',
              '''        validFrom: v.validFrom,\n        validTo: v.validTo,\n      })),\n''',
              '''        validFrom: v.validFrom,\n        validTo: v.validTo,\n        systemhouseId: v.systemhouseId,\n      })),\n''',
              'collect value systemhouseId',
          )
      - name: Format modified files
        run: bunx prettier --write src/lib/json-schema.ts src/lib/json-import-service.ts src/lib/backup/avkk-payload.ts
      - name: Remove one-shot workflow
        run: rm .github/workflows/bsf03d-implement-io-backup.yml
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(bsf03d): Kategorien in Import Export und Backup aufnehmen"
          git push origin HEAD:feat/bsf03d-workpackage-categories
