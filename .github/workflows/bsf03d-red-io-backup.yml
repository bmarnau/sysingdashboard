name: BSF03D RED IO Backup

on:
  push:
    branches:
      - feat/bsf03d-workpackage-categories
    paths:
      - .github/workflows/bsf03d-red-io-backup.yml

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf03d-workpackage-categories
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - run: bun install --frozen-lockfile
      - name: Confirm RED
        shell: bash
        run: |
          set +e
          bunx vitest run \
            src/__tests__/io/workpackage-category-io.test.ts \
            src/__tests__/backup/reference-data-scope.test.ts \
            > /tmp/red.log 2>&1
          status=$?
          cat /tmp/red.log
          if [ "$status" -eq 0 ]; then
            echo "Expected RED tests to fail, but they passed."
            exit 1
          fi
          echo "RED confirmed with exit code $status"
      - name: Remove one-shot workflow
        run: rm .github/workflows/bsf03d-red-io-backup.yml
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(bsf03d): IO-RED-Workflow entfernen"
          git push origin HEAD:feat/bsf03d-workpackage-categories
