name: BSF03D RED Test Format Once
on:
  push:
    branches:
      - feat/bsf03d-workpackage-categories
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf03d-workpackage-categories
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format exact RED test
        run: bunx prettier --write src/__tests__/components/WorkPackageDialog.category.test.tsx
      - name: Remove helper and commit formatter output
        run: |
          rm .github/workflows/bsf03d-red-test-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/__tests__/components/WorkPackageDialog.category.test.tsx .github/workflows/bsf03d-red-test-format-once.yml
          git commit -m "style(bsf03d): RED-Dialogtest formatieren"
          git push origin HEAD:feat/bsf03d-workpackage-categories
