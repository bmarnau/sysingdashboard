name: BSF03D Sync Types and GREEN

on:
  push:
    branches:
      - feat/bsf03d-workpackage-categories
    paths:
      - .github/workflows/bsf03d-sync-types-green.yml

permissions:
  contents: write

jobs:
  sync-and-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf03d-workpackage-categories
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Sync generated Supabase types to verified live schema
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/integrations/supabase/types.ts')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''          name: string\n          updated_at: string\n          version: number\n        }\n        Insert: {\n''',
                  '''          name: string\n          scope_type: string\n          updated_at: string\n          version: number\n        }\n        Insert: {\n''',
                  'reference_catalog Row scope_type',
              ),
              (
                  '''          name: string\n          updated_at?: string\n          version?: number\n        }\n        Update: {\n''',
                  '''          name: string\n          scope_type?: string\n          updated_at?: string\n          version?: number\n        }\n        Update: {\n''',
                  'reference_catalog Insert scope_type',
              ),
              (
                  '''          name?: string\n          updated_at?: string\n          version?: number\n        }\n        Relationships: []\n      }\n      reference_value: {\n''',
                  '''          name?: string\n          scope_type?: string\n          updated_at?: string\n          version?: number\n        }\n        Relationships: []\n      }\n      reference_value: {\n''',
                  'reference_catalog Update scope_type',
              ),
              (
                  '''          sort_order: number\n          updated_at: string\n          updated_by: string | null\n''',
                  '''          sort_order: number\n          systemhouse_id: string | null\n          updated_at: string\n          updated_by: string | null\n''',
                  'reference_value Row systemhouse_id',
              ),
              (
                  '''          sort_order?: number\n          updated_at?: string\n          updated_by?: string | null\n''',
                  '''          sort_order?: number\n          systemhouse_id?: string | null\n          updated_at?: string\n          updated_by?: string | null\n''',
                  'reference_value Insert/Update systemhouse_id',
              ),
              (
                  '''          {\n            foreignKeyName: "reference_value_parent_value_id_fkey"\n            columns: ["parent_value_id"]\n            isOneToOne: false\n            referencedRelation: "reference_value"\n            referencedColumns: ["id"]\n          },\n        ]\n      }\n      reference_value_history: {\n''',
                  '''          {\n            foreignKeyName: "reference_value_parent_value_id_fkey"\n            columns: ["parent_value_id"]\n            isOneToOne: false\n            referencedRelation: "reference_value"\n            referencedColumns: ["id"]\n          },\n          {\n            foreignKeyName: "reference_value_systemhouse_fk"\n            columns: ["systemhouse_id"]\n            isOneToOne: false\n            referencedRelation: "systemhouse"\n            referencedColumns: ["id"]\n          },\n        ]\n      }\n      reference_value_history: {\n''',
                  'reference_value systemhouse relationship',
              ),
              (
                  '''          snapshot: Json\n          value_id: string\n        }\n        Insert: {\n''',
                  '''          snapshot: Json\n          systemhouse_id: string | null\n          value_id: string\n        }\n        Insert: {\n''',
                  'reference_value_history Row systemhouse_id',
              ),
              (
                  '''          snapshot: Json\n          value_id: string\n        }\n        Update: {\n''',
                  '''          snapshot: Json\n          systemhouse_id?: string | null\n          value_id: string\n        }\n        Update: {\n''',
                  'reference_value_history Insert systemhouse_id',
              ),
              (
                  '''          snapshot?: Json\n          value_id?: string\n        }\n        Relationships: []\n''',
                  '''          snapshot?: Json\n          systemhouse_id?: string | null\n          value_id?: string\n        }\n        Relationships: [\n          {\n            foreignKeyName: "reference_value_history_systemhouse_fk"\n            columns: ["systemhouse_id"]\n            isOneToOne: false\n            referencedRelation: "systemhouse"\n            referencedColumns: ["id"]\n          },\n        ]\n''',
                  'reference_value_history Update/relationship',
              ),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if label == 'reference_value Insert/Update systemhouse_id':
                  if count != 2:
                      raise SystemExit(f'{label}: expected 2 matches, got {count}')
                  text = text.replace(old, new)
              else:
                  if count != 1:
                      raise SystemExit(f'{label}: expected 1 match, got {count}')
                  text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

          fixture = Path('src/__tests__/components/avkk-responsibility-section.test.tsx')
          ftext = fixture.read_text(encoding='utf-8')
          old = '''  validFrom: "2026-08-01T00:00:00Z",\n  validTo: null,\n};\n'''
          new = '''  validFrom: "2026-08-01T00:00:00Z",\n  validTo: null,\n  systemhouseId: null,\n};\n'''
          if ftext.count(old) != 1:
              raise SystemExit(f'AVKK fixture: expected 1 match, got {ftext.count(old)}')
          fixture.write_text(ftext.replace(old, new), encoding='utf-8')
      - name: Format changed TypeScript files
        run: bunx prettier --write src/integrations/supabase/types.ts src/__tests__/components/avkk-responsibility-section.test.tsx
      - name: Focused Reference Data tests
        id: tests
        continue-on-error: true
        run: |
          bunx vitest run \
            src/__tests__/lib/reference-data/service.test.ts \
            src/__tests__/lib/reference-data/cache-v2.test.ts \
            src/__tests__/lib/reference-data/service-scope.test.ts
      - name: TypeScript typecheck
        id: types
        continue-on-error: true
        run: bun run typecheck
      - name: Remove one-shot workflow
        if: always()
        run: rm .github/workflows/bsf03d-sync-types-green.yml
      - name: Commit schema type sync and cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(bsf03d): Supabase-Typen auf Scope-Schema synchronisieren"
          git push origin HEAD:feat/bsf03d-workpackage-categories
      - name: Assert GREEN
        if: always()
        shell: bash
        run: |
          echo "tests=${{ steps.tests.outcome }} types=${{ steps.types.outcome }}"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.types.outcome }}" = "success"
