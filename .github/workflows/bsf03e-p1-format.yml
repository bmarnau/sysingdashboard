name: BSF03E P1 Format Boundary Tests

on:
  push:
    branches: [feat/bsf-03e-person-view]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf-03e-person-view
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format P1 boundary RED tests
        run: bunx prettier --write src/__tests__/integration/responsibility-person-view-adapter.test.ts src/__tests__/backend/responsibility-person-view.functions.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/__tests__/integration/responsibility-person-view-adapter.test.ts src/__tests__/backend/responsibility-person-view.functions.test.ts
          git commit -m "style(bsf03e): P1 Boundary-Tests per Projekt-Prettier formatieren"
          git push origin HEAD:feat/bsf-03e-person-view
