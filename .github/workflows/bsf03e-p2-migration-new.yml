name: BSF03E P2 Create Migration

on:
  push:
    branches: [feat/bsf-03e-responsibility-mutations]

permissions:
  contents: write

jobs:
  create_migration:
    if: github.event.head_commit.message == 'ci(bsf03e): P2 migration canonical erzeugen'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf-03e-responsibility-mutations
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Create canonical Supabase migration
        run: supabase migration new bsf03e_responsibility_mutations
      - name: Commit migration file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "feat(bsf03e): P2 Migration kanonisch anlegen"
          git push origin HEAD:feat/bsf-03e-responsibility-mutations
