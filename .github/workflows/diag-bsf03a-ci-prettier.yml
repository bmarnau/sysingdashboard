name: Diagnostic BSF03A CI Prettier Diff

on:
  push:
    branches:
      - feat/bsf-03a-project-controlling

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          bunx prettier .github/workflows/ci.yml --write
          git diff -- .github/workflows/ci.yml
