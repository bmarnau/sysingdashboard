name: Diagnostic BSF03A Closure Formatter

on:
  push:
    branches:
      - feat/bsf-03a-project-controlling

permissions:
  contents: write

jobs:
  format-closure-docs:
    if: contains(github.event.head_commit.message, 'chore(diag): add BSF03A closure formatter')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf-03a-project-controlling
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format exact BSF-03A closure files
        run: |
          bunx prettier --write \
            CHANGELOG.md \
            docs/BSF-03A-CLOSURE-2026-09-14.md \
            docs/BSF-03A-DESIGN.md \
            docs/BSF-CURRENT-PRIORITIES.md \
            docs/CURRENT-STATUS.md \
            docs/ENTWICKLUNGSTAGEBUCH.md \
            docs/LOVABLE-PROMPT-PLAN-BSF-03A.md \
            docs/PROJECT-STATUS.yaml \
            docs/RBAC-MATRIX.md \
            docs/SPRINT-PLAN-MVP-BSF.md
      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- \
            CHANGELOG.md \
            docs/BSF-03A-CLOSURE-2026-09-14.md \
            docs/BSF-03A-DESIGN.md \
            docs/BSF-CURRENT-PRIORITIES.md \
            docs/CURRENT-STATUS.md \
            docs/ENTWICKLUNGSTAGEBUCH.md \
            docs/LOVABLE-PROMPT-PLAN-BSF-03A.md \
            docs/PROJECT-STATUS.yaml \
            docs/RBAC-MATRIX.md \
            docs/SPRINT-PLAN-MVP-BSF.md; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            docs/BSF-03A-CLOSURE-2026-09-14.md \
            docs/BSF-03A-DESIGN.md \
            docs/BSF-CURRENT-PRIORITIES.md \
            docs/CURRENT-STATUS.md \
            docs/ENTWICKLUNGSTAGEBUCH.md \
            docs/LOVABLE-PROMPT-PLAN-BSF-03A.md \
            docs/PROJECT-STATUS.yaml \
            docs/RBAC-MATRIX.md \
            docs/SPRINT-PLAN-MVP-BSF.md
          git commit -m "style(bsf03a): format Abschlussdokumentation"
          git push origin HEAD:feat/bsf-03a-project-controlling
