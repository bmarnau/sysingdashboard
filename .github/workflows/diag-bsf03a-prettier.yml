name: Diagnose BSF-03A Prettier

on:
  push:
    branches:
      - feat/bsf-03a-project-controlling

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          bunx prettier src/__tests__/lib/project-controlling.test.ts --write
          git diff -- src/__tests__/lib/project-controlling.test.ts
