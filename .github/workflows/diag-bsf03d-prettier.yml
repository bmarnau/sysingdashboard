name: DIAG BSF-03D Prettier

on:
  push:
    branches:
      - diag/bsf03d-prettier-output

permissions:
  contents: write

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Materialize exact DATA-SCHEMA Prettier result
        shell: bash
        run: |
          bunx prettier --write docs/DATA-SCHEMA.md
          if git diff --quiet -- docs/DATA-SCHEMA.md; then
            echo "DATA-SCHEMA already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DATA-SCHEMA.md
          git commit -m "chore(diag): materialize DATA-SCHEMA prettier output"
          git push
