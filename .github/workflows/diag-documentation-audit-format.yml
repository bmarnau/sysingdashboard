name: Diagnostic documentation audit formatter

on:
  push:
    branches:
      - feat/bsf-03a-project-controlling

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.event.head_commit.message == 'chore(diag): format documentation audit' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf-03a-project-controlling
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format documentation audit files
        run: |
          bunx prettier --write \
            CHANGELOG.md \
            docs/ARCHITECTURE.md \
            docs/BSF-03A-CLOSURE-2026-09-14.md \
            docs/BSF-CURRENT-PRIORITIES.md \
            docs/BSF-KIOSK-02-DESIGN.md \
            docs/CURRENT-STATUS.md \
            docs/ENTWICKLUNGSTAGEBUCH.md \
            docs/LOVABLE-PROMPT-PLAN-KIOSK-02.md \
            docs/RBAC-MATRIX.md \
            docs/SPRINT-PLAN-MVP-BSF.md \
            docs/superpowers/plans/2026-09-14-bsf-kiosk-02-internal-read.md \
            src/__tests__/unit/help-navigation-topics.test.ts \
            src/lib/help-documentation.ts \
            src/lib/help-navigation-topics.ts
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md \
            docs/ARCHITECTURE.md \
            docs/BSF-03A-CLOSURE-2026-09-14.md \
            docs/BSF-CURRENT-PRIORITIES.md \
            docs/BSF-KIOSK-02-DESIGN.md \
            docs/CURRENT-STATUS.md \
            docs/ENTWICKLUNGSTAGEBUCH.md \
            docs/LOVABLE-PROMPT-PLAN-KIOSK-02.md \
            docs/RBAC-MATRIX.md \
            docs/SPRINT-PLAN-MVP-BSF.md \
            docs/superpowers/plans/2026-09-14-bsf-kiosk-02-internal-read.md \
            src/__tests__/unit/help-navigation-topics.test.ts \
            src/lib/help-documentation.ts \
            src/lib/help-navigation-topics.ts
          git commit -m "style(docs): format documentation audit"
          git push origin HEAD:feat/bsf-03a-project-controlling
