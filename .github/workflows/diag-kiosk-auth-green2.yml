name: Diagnose Kiosk Auth GREEN 2

on:
  push:
    branches:
      - diag/kiosk-auth-green2

jobs:
  targeted-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/__tests__/security/auth-accounts-functions.test.ts src/__tests__/security/kiosk-migration-security.test.ts
