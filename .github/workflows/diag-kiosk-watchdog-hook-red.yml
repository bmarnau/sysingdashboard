name: Diagnose Kiosk Watchdog Hook RED

on:
  push:
    branches:
      - diag/kiosk-watchdog-hook-red

jobs:
  targeted-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx vitest run src/__tests__/hooks/useKioskSessionWatchdog.test.tsx
