name: diag-kiosk01-task2-verify

on:
  push:
    branches:
      - diag/kiosk01-task2-verify

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf-kiosk-01-demo-pilot
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx prettier --check src/lib/user-management.ts src/lib/rbac/permissions.ts backend/services/rbac.mjs src/lib/rbac/permission-groups.ts src/integrations/supabase/types.ts src/__tests__/lib/kiosk-rbac.test.ts
      - run: node scripts/check-rbac.mjs
      - run: bun run typecheck
      - run: bunx vitest run src/__tests__/lib/kiosk-rbac.test.ts
