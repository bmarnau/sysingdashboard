name: diag-kiosk01-task3-red

on:
  push:
    branches:
      - diag/kiosk01-task3-red

permissions:
  contents: read

# Verify after policy + authenticated-route integration (href redirect fix).
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf-kiosk-01-demo-pilot
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prettier --check src/lib/kiosk/kiosk-session-policy.ts src/routes/_authenticated/route.tsx src/__tests__/lib/kiosk-session-policy.test.ts
      - run: bun run typecheck
      - run: bunx vitest run src/__tests__/lib/kiosk-session-policy.test.ts
