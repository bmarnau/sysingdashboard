name: Diagnostic Prettier Diff

on:
  push:
    branches:
      - feat/bsf-03a-project-controlling

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Emit exact Prettier diff
        run: |
          bunx prettier --write src/__tests__/lib/golden-dataset-expected.test.ts
          git diff --no-ext-diff -- src/__tests__/lib/golden-dataset-expected.test.ts
          exit 1
