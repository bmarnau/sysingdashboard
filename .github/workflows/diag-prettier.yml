name: Diagnose Prettier Output

on:
  push:
    branches:
      - diag/pr139-prettier-output-2026-09-14

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Print exact Prettier diff
        run: |
          bunx prettier --write docs/superpowers/plans/2026-09-14-bsf-03b-performance-statement.md
          git diff --no-ext-diff --unified=80 -- docs/superpowers/plans/2026-09-14-bsf-03b-performance-statement.md
          test -z "$(git status --short -- docs/superpowers/plans/2026-09-14-bsf-03b-performance-statement.md)"
