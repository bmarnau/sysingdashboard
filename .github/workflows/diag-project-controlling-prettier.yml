name: Diagnostic Project Controlling Prettier Diff

on:
  push:
    branches:
      - feat/bsf-03a-project-controlling

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Emit exact Prettier diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bunx prettier --write             src/components/project-controlling/ProjectControllingFilters.tsx             src/components/project-controlling/ProjectControllingDrilldown.tsx             src/components/project-controlling/ProjectControllingView.tsx             src/routes/_authenticated/projektcontrolling.tsx             src/__tests__/components/ProjectControllingView.test.tsx
          git diff --no-ext-diff > /tmp/prettier.diff
          {
            echo '### Diagnostic Prettier Diff'
            echo
            echo '~~~diff'
            cat /tmp/prettier.diff
            echo '~~~'
          } > /tmp/comment.md
          gh api repos/${{ github.repository }}/issues/144/comments -F body=@/tmp/comment.md
          test ! -s /tmp/prettier.diff
