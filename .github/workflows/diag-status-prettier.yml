name: Diagnostic status Prettier 1.65.1

on:
  push:
    branches:
      - diag/status-prettier-1.65.1

permissions:
  contents: write

jobs:
  prettier-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/status-prettier-1.65.1
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply canonical Prettier output
        run: |
          bunx prettier --write \
            backend/services/githubStatus.mjs \
            docs/API.md \
            src/__tests__/components/system-status-backend-evidence.test.ts \
            src/components/SystemStatusDialog.tsx \
            src/lib/app-version.ts \
            src/lib/help-navigation-topics.ts
      - name: Commit canonical output
        run: |
          if git diff --quiet -- \
            backend/services/githubStatus.mjs \
            docs/API.md \
            src/__tests__/components/system-status-backend-evidence.test.ts \
            src/components/SystemStatusDialog.tsx \
            src/lib/app-version.ts \
            src/lib/help-navigation-topics.ts; then
            echo "No Prettier diff."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/services/githubStatus.mjs \
            docs/API.md \
            src/__tests__/components/system-status-backend-evidence.test.ts \
            src/components/SystemStatusDialog.tsx \
            src/lib/app-version.ts \
            src/lib/help-navigation-topics.ts
          git commit -m "chore(diag): canonical status prettier output"
          git push origin HEAD:diag/status-prettier-1.65.1
