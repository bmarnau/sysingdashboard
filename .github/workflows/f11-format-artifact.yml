name: F11 Format Artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format known F-11 files
        run: |
          bunx prettier --write \
            docs/PROJECTMANAGER-PROJEKTCOCKPIT-IMPLEMENTATION.md \
            docs/ROLE-ACCEPTANCE-09C.md \
            src/components/dashboard/views/ProjectDetailView.tsx \
            src/components/dashboard/views/ProjectsView.tsx \
            src/components/report/ReportDialog.tsx
      - name: Save Prettier patch
        run: git diff --binary > prettier.patch
      - uses: actions/upload-artifact@v4
        with:
          name: f11-prettier-patch
          path: prettier.patch
          if-no-files-found: error
