name: Format Debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format target document
        run: bunx prettier --write docs/ROLE-ACCEPTANCE-09C.md
      - name: Commit formatting when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ROLE-ACCEPTANCE-09C.md
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style(docs): format F-11 acceptance"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
