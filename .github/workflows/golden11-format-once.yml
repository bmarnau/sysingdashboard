name: Temporary Golden 1.1 formatter

on:
  push:
    branches:
      - feat/bsf-03b-performance-statement
    paths:
      - ".github/workflows/golden11-format-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf-03b-performance-statement
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: |
          bunx prettier --write \
            docs/examples/golden-dataset/v1/expected/performance-statement.json \
            src/__tests__/lib/golden-dataset-expected.test.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/examples/golden-dataset/v1/expected/performance-statement.json \
            src/__tests__/lib/golden-dataset-expected.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "style(golden): BSF-03B Expected Results formatieren"
          git push origin HEAD:feat/bsf-03b-performance-statement
