name: Kiosk Import README Format

on:
  push:
    branches: [docs/sysing-kiosk-001-tdf]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/sysing-kiosk-001-tdf
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format Kiosk import README
        run: bunx prettier --write docs/examples/README-KIOSK-IMPORT.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/examples/README-KIOSK-IMPORT.md
          git commit -m "style(kiosk-docs): Importanleitung formatieren"
          git push origin HEAD:docs/sysing-kiosk-001-tdf
