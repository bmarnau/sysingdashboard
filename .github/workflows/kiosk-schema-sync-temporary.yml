name: Kiosk schema snapshot sync temporary

on:
  push:
    branches:
      - tmp/kiosk-schema-sync-2026-09-17
    paths:
      - ".github/workflows/kiosk-schema-sync-temporary.yml"
      - "supabase/migrations/**"
      - "supabase/schema/public-schema.sql"
      - "src/integrations/supabase/types.ts"
      - "supabase/tests/bsf-kiosk-01-role-contract.sql"
      - "supabase/tests/bsf-kiosk-01-role-concurrency.sh"

permissions:
  contents: write

env:
  BUN_VERSION: latest
  NODE_VERSION: "22"

jobs:
  sync:
    name: Sync deterministic DB-SOT snapshot
    if: github.repository == 'bmarnau/sysingdashboard' && github.ref == 'refs/heads/tmp/kiosk-schema-sync-2026-09-17'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/kiosk-schema-sync-2026-09-17
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "${{ env.BUN_VERSION }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start local Supabase
        run: supabase start

      - name: Rebuild database from migrations
        run: bun run db:schema:rebuild

      - name: Kiosk database contract including T06
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/bsf-kiosk-01-role-contract.sql

      - name: Generate deterministic schema and types
        run: |
          mkdir -p supabase/schema
          bun run db:schema:snapshot
          bun run db:types:generate

      - name: Guard generated types
        run: |
          if ! cmp -s src/integrations/supabase/types.generated.ts src/integrations/supabase/types.ts; then
            echo "Unexpected Supabase type drift; refusing automatic sync."
            diff -u src/integrations/supabase/types.ts src/integrations/supabase/types.generated.ts || true
            exit 1
          fi
          echo "Supabase types unchanged."

      - name: Sync canonical schema snapshot only
        run: cp supabase/schema/public-schema.generated.sql supabase/schema/public-schema.sql

      - name: Verify drift and patch hygiene
        run: |
          bun run db:schema:check
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "supabase/schema/public-schema.sql"

      - name: Commit deterministic snapshot
        run: |
          if git diff --quiet -- supabase/schema/public-schema.sql; then
            echo "Canonical schema already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/schema/public-schema.sql
          git commit -m "chore(db): sync kiosk concurrency schema snapshot"
          git push origin HEAD:tmp/kiosk-schema-sync-2026-09-17

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
