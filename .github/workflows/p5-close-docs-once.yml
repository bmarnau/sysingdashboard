name: P5 Close Docs Once

on:
  push:
    branches:
      - feat/bsf03-p5-responsibility-management
    paths:
      - .github/workflows/p5-close-docs-once.yml

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf03-p5-responsibility-management
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Synchronize BSF-03 closure documentation
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 occurrence, got {count}')
              return text.replace(old, new, 1)

          def regex_once(text, pattern, repl, label, flags=re.S):
              out, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 regex match, got {count}')
              return out

          # CHANGELOG
          p = 'CHANGELOG.md'
          t = read(p)
          marker = '## 1.60.0 - 2026-09-13\n'
          entry = '''## 1.61.0 - 2026-09-13

- **Kundenverantwortung verwalten (BSF-03 P5, Issue #105)**: Neuer, von „Meine Kunden“ getrennter Bereich für Systemadministrator, Administrator und Teamlead. Verantwortungen können systemhausweit zugewiesen, gewechselt und beendet werden, auch ohne eigenen operativen Kundenzugriff.
- **Least-Privilege-Managementsicht**: Die Verwaltung zeigt ausschließlich Kundenkopf, aktuelle primäre Verantwortung und eine datenminimierte Kandidatenliste. Sie erzeugt keinen Zugriff auf Projekte, Arbeitspakete oder Tätigkeiten.
- **RLS bleibt eng**: Self-only-Regeln auf Profilen, Rollen und Systemhaus-Zugehörigkeiten sowie der Customer-Access-Scope wurden nicht verbreitert. Öffentliche P5-RPCs laufen als SECURITY INVOKER; der notwendige Fremdleseanteil ist auf private Helper mit leerem search_path begrenzt.
- **Atomarer Lifecycle**: Ein Wechsel beendet die alte und erzeugt die neue Responsibility in derselben Transaktion; ungültige Zielpersonen rollen den gesamten Wechsel zurück. Historie bleibt erhalten, Hard Delete findet nicht statt.
- **Sicherheit und Tests**: R19–R31, Unit-/Security-Verträge und E2E decken Datenminimierung, Cross-Systemhouse, IDOR/BOLA, Viewer/Customer-Ausschluss, Zuweisen, Wechseln, Beenden und Rollback ab.
- **UI-Konsistenz**: Der gemeinsame Kundenseitenrahmen behält für die persönliche Sicht „Meine Kunden“ und zeigt in der Managementroute ausdrücklich „Kundenverantwortung“.

'''
          t = once(t, marker, entry + marker, 'changelog marker')
          write(p, t)

          # PROJECT-STATUS.yaml
          p = 'docs/PROJECT-STATUS.yaml'
          t = read(p)
          t = once(t, 'dashboard: "1.60.0"', 'dashboard: "1.61.0"', 'project version')
          old = '''  currentSprint: "BSF-03"
  currentSprintTitle: "Kundenverantwortung und Kundensicht"
  currentSprintStatus: "in-progress"
  nextSprint: "BSF-03D"
  previousSprint: "BSF-02"
  previousSprintStatus: "completed"
  releaseReadiness: "passed"
  testsPassing: 696'''
          new = '''  currentSprint: "BSF-03D"
  currentSprintTitle: "Arbeitspaket-Kategorien"
  currentSprintStatus: "planned"
  nextSprint: "BSF-03A"
  previousSprint: "BSF-03"
  previousSprintStatus: "completed"
  releaseReadiness: "passed"
  testsPassing: 704'''
          t = once(t, old, new, 'currentState')
          t = once(t,
              '      - "BSF-03 P3/P4 Runtime/UI Meine Kunden und Kundendetail integriert und vollständig gegatet"',
              '      - "BSF-03 P3/P4 Runtime/UI Meine Kunden und Kundendetail integriert und vollständig gegatet"\n      - "BSF-03 P5 Kundenverantwortung mit datensparsamer Managementsicht, atomarem Lifecycle und unverändert engem operativem Kundenscope umgesetzt"\n      - "BSF-03 Kundenverantwortung und Kundensicht vollständig abgeschlossen"',
              'phase3 outcomes')
          insert_before = '  - id: "BSF-01"\n'
          completed = '''  - id: "BSF-03"
    title: "Kundenverantwortung und Kundensicht"
    version: "1.61.0"
    status: "completed"
    summary: >-
      Customer Responsibility als systemhausgebundene Beziehung umgesetzt; persönliche
      fail-closed Sicht Meine Kunden und read-only Kundendetail sowie getrennte,
      datensparsame Managementsicht für Zuweisen, Wechseln und Beenden integriert.
      Responsibility erzeugt weder operativen Customer Access noch Schreibrechte;
      Cross-Systemhouse/IDOR und Zielrollen werden serverseitig erzwungen.
'''
          t = once(t, insert_before, completed + insert_before, 'completed sprint insertion')
          t = regex_once(t,
              r'(  - id: "BSF-03"\n    title: "Kundenverantwortung und Kundensicht"\n    status: ")in-progress("\n)',
              r'\1completed\2', 'roadmap BSF-03 status')
          t = once(t, '    passing: 696', '    passing: 704', 'quality passing')
          t = once(t, 'currentRelease: "1.60.0"', 'currentRelease: "1.61.0"', 'release version')
          t = once(t,
              '    - "docs/BSF-03-RUNTIME-UI-MEINE-KUNDEN-2026-09-13.md"',
              '    - "docs/BSF-03-RUNTIME-UI-MEINE-KUNDEN-2026-09-13.md"\n    - "docs/BSF-03-RESPONSIBILITY-MANAGEMENT-READ-CONTRACT-2026-09-13.md"\n    - "docs/BSF-03-CLOSURE-2026-09-13.md"',
              'release evidence')
          t = once(t,
              'nextReleaseTarget: "BSF-03 P5 Kundenverantwortung verwalten"',
              'nextReleaseTarget: "BSF-03D Arbeitspaket-Kategorien"',
              'next release')
          write(p, t)

          # CURRENT-STATUS.md
          p = 'docs/CURRENT-STATUS.md'
          t = read(p)
          t = once(t, '- Dashboard-Version: `1.60.0`', '- Dashboard-Version: `1.61.0`', 'current status version')
          section = '''### BSF-03 — DONE / Issue #105

BSF-03 „Kundenverantwortung und Kundensicht“ ist mit P1–P5 fachlich abgeschlossen. P1/P2 lieferten das Datenbank-/Security-Fundament, P3/P4 die persönliche fail-closed Sicht **Meine Kunden** und das read-only Kundendetail, P5 ergänzt die getrennte Managementsicht **Kundenverantwortung**.

Verbindlicher Endzustand:

- Customer Identity bleibt `(systemhouseId, customerId)`,
- Responsibility ist Beziehung/Scope und keine globale Rolle,
- Responsibility allein erzeugt weder `customer_access` noch Schreibrechte,
- `Meine Kunden` bleibt die Schnittmenge aus aktiver Membership, eigener aktiver Responsibility, Customer Access >= read und `dashboard.view`,
- `Kundenverantwortung` ist davon getrennt und nur mit `customer.responsibility.manage` nutzbar,
- Systemadministrator, Administrator und Teamlead dürfen Responsibility für Kunden des eigenen Systemhauses verwalten, auch ohne eigenen operativen Customer Access,
- Kandidaten sind auf aktive Mitglieder mit den zulässigen Rollen begrenzt und werden nur als ID + Anzeigename geliefert,
- bestehende Self-only-RLS auf `profiles`, `user_roles` und `systemhouse_membership` wurde nicht verbreitert,
- Wechsel erfolgt atomar, Historie bleibt erhalten, Hard Delete findet nicht statt,
- Cross-Systemhouse, IDOR/BOLA, Viewer/Customer-Ziele und manipulierte Browserrollen bleiben DENY.

P5-Evidenz:

- Migration `20260913150000_bsf03_p5_responsibility_management` live registriert,
- SQL-Vertrag R19–R31,
- öffentliche P5-RPCs `SECURITY INVOKER`, private Fremdlese-Helper `SECURITY DEFINER` mit leerem `search_path`,
- Live-Read-only-Prüfung der Function-Grants und unverändert engen Personen-/Customer-Policies,
- 90 Unit-/Component-Testdateien, 704 Tests PASS, 4 TODO auf dem geprüften Funktions-Head,
- Abschlussnachweis: `docs/BSF-03-CLOSURE-2026-09-13.md`.

Der finale Release-/Merge-Nachweis wird über PR #132 und dessen Exact-Head-Gates geführt. Danach ist **BSF-03D — Arbeitspaket-Kategorien (#103)** der nächste Entwicklungsschritt.

'''
          t = regex_once(t, r'### BSF-03 — IN ARBEIT / Issue #105\n.*?(?=## F-11)', section, 'CURRENT-STATUS BSF-03 section')
          write(p, t)

          # BSF-CURRENT-PRIORITIES.md
          p = 'docs/BSF-CURRENT-PRIORITIES.md'
          t = read(p)
          section = '''### BSF-03 — Kundenverantwortung / Kundensicht (#105) — DONE

P1–P5 sind umgesetzt. `Meine Kunden` bleibt persönliche fail-closed Sicht; die getrennte Managementsicht `Kundenverantwortung` erlaubt Systemadministrator, Administrator und Teamlead die systemhausweite Pflege der primären Responsibility ohne zusätzlichen operativen Customer Access.

Nachweise:

- Fach-/Security-Vertrag PR #118,
- P1/P2 PR #127,
- P3/P4 PR #128,
- P5 PR #132 (Abschlusskandidat auf Version 1.61.0),
- R19–R31 sowie Unit-/Security-/E2E-Nachweise,
- Live-Schema-Prüfung der P5-RPCs, Grants und unverändert engen RLS-Grenzen,
- Abschlussdokument `docs/BSF-03-CLOSURE-2026-09-13.md`.

### Nächster Schritt: BSF-03D — Arbeitspaket-Kategorien (#103)

BSF-03D ist nach dem BSF-03-Abschluss der nächste fachliche Sprint. Der Scope bleibt unverändert: systemhausweite editierbare Kategorien als optionale stabile Auswertungsdimension, ohne implizite Billable-/Prioritäts-/Status-Semantik.

'''
          t = regex_once(t, r'### BSF-03 — Kundenverantwortung / „Meine Kunden“ \(#105\) — IN ARBEIT\n.*?(?=## Lovable-/Werkzeugsteuerung)', section, 'priorities BSF-03 section')
          t = once(t,
              '2. **BSF-03 — IN ARBEIT; P5 NÄCHSTER SCHRITT**\n3. **BSF-03D — GEPLANT / bis BSF-03-Abschluss gesperrt**',
              '2. **BSF-03 — DONE**\n3. **BSF-03D — NÄCHSTER SCHRITT / FREIGEGEBEN**',
              'priorities order')
          write(p, t)

          # SPRINT-PLAN-MVP-BSF.md
          p = 'docs/SPRINT-PLAN-MVP-BSF.md'
          t = read(p)
          focus = '''### 2.1 Aktueller Fokus 13.09.2026

1. **BSF-02 / BSF-02C — DONE**
2. **BSF-03 P1/P2 — DONE / auf `main`**
3. **BSF-03 P3/P4 — DONE / auf `main`**
4. **BSF-03 P5 — ABSCHLUSSKANDIDAT in PR #132**
   - getrennte Managementsicht `Kundenverantwortung`,
   - systemhausweite Verwaltung ohne impliziten operativen Customer Access,
   - datensparsamer Manager-Read ohne breite Personen-RLS,
   - atomarer Lifecycle für Zuweisen/Wechseln/Beenden,
   - R19–R31 + Unit/Security/E2E,
   - Version 1.61.0 und Abschlussdokumentation.
5. **BSF-03D — NÄCHSTER SPRINT nach Merge/Finalverifikation von PR #132**

'''
          t = regex_once(t, r'### 2\.1 Aktueller Fokus 13\.09\.2026\n.*?(?=### 2\.2)', focus, 'sprint focus')
          t = once(t,
              '`BSF-03/P5 → BSF-03-Abschluss → BSF-03D → BSF-03A → BSF-03B → BSF-03E → BSF-03C → BSF-DOC-01 → BSF-DOC-02 → BSF-DOC-03 → BSF-04 → BSF-04A → BSF-05 → BSF-06 → BSF-07 → BSF-09 → BSF-10 → BSF-FINAL → INTEGRATION-READINESS`',
              '`BSF-03D → BSF-03A → BSF-03B → BSF-03E → BSF-03C → BSF-DOC-01 → BSF-DOC-02 → BSF-DOC-03 → BSF-04 → BSF-04A → BSF-05 → BSF-06 → BSF-07 → BSF-09 → BSF-10 → BSF-FINAL → INTEGRATION-READINESS`',
              'sprint sequence')
          bsf03 = '''### BSF-03 — Kundenverantwortung und „Meine Kunden“ (#105)

- P1/P2 Datenbank-/Security-Fundament: **DONE**.
- P3/P4 persönliche fail-closed Sicht `Meine Kunden` + read-only Kundendetail: **DONE**.
- P5 getrennte Managementsicht `Kundenverantwortung`: **DONE / PR #132 Abschlusskandidat**.
- Management nur für `customer.responsibility.manage`; keine impliziten operativen Kundenrechte.
- Manager-Read datenminimiert, bestehende Self-only-RLS unverändert eng.
- Responsibility-Wechsel atomar und historisiert; Cross-Systemhouse/IDOR/BOLA DENY.
- Abschlussdokument: `docs/BSF-03-CLOSURE-2026-09-13.md`.
- Gate: finaler Exact-Head von PR #132 vollständig grün und Merge/Main-Verifikation.
- Status: **ABSCHLUSSKANDIDAT**.

'''
          t = regex_once(t, r'### BSF-03 — Kundenverantwortung und „Meine Kunden“ \(#105\)\n.*?(?=### BSF-03D)', bsf03, 'sprint BSF-03 section')
          write(p, t)

          # ENTWICKLUNGSTAGEBUCH.md
          p = 'docs/ENTWICKLUNGSTAGEBUCH.md'
          t = read(p)
          t = once(t, 'Stand: 2026-09-13 · Dashboard-Version 1.60.0', 'Stand: 2026-09-13 · Dashboard-Version 1.61.0', 'diary version')
          t = once(t,
              '| Aktueller Stand     | Version 1.60.0; MVP-Baseline CLOSED/PASS; BSF-03 P3/P4 „Meine Kunden“ read-only umgesetzt; P5 Verantwortungsverwaltung offen.',
              '| Aktueller Stand     | Version 1.61.0; MVP-Baseline CLOSED/PASS; BSF-03 Kundenverantwortung und Kundensicht P1–P5 abgeschlossen; BSF-03D folgt.',
              'diary management row')
          appendix = '''

## 2026-09-13 — Version 1.61.0 — BSF-03 P5 / Kundensicht abgeschlossen

- Neue, von **Meine Kunden** getrennte Managementsicht **Kundenverantwortung** für Systemadministrator, Administrator und Teamlead.
- Verantwortung kann für Kunden des eigenen Systemhauses zugewiesen, gewechselt und beendet werden, ohne dem Manager dadurch operativen Customer Access zu geben.
- Kandidatenverzeichnis auf ID + Anzeigename minimiert; Viewer/Customer ausgeschlossen; Self-only-RLS auf Profilen, Rollen und Membership nicht verbreitert.
- Wechsel erfolgt atomar und historisiert; ungültige Ziele rollen vollständig zurück.
- P5-Migration und Funktionsrechte live read-only geprüft; SQL-Vertrag R19–R31 sowie Unit-/Security-/E2E-Regressionsschutz ergänzt.
- Unabhängiger UI-Review fand den falschen gemeinsamen Shell-Titel „Meine Kunden“ auf der Managementroute; test-first auf konfigurierbaren Titel korrigiert.
- Abschlussnachweis: `docs/BSF-03-CLOSURE-2026-09-13.md`.
- Nächster fachlicher Sprint nach finalem Merge-/Main-Nachweis: **BSF-03D — Arbeitspaket-Kategorien**.
'''
          if '## 2026-09-13 — Version 1.61.0 — BSF-03 P5 / Kundensicht abgeschlossen' in t:
              raise SystemExit('diary appendix already exists')
          t = t.rstrip() + appendix + '\n'
          write(p, t)
          PY
      - name: Format and validate documentation
        run: |
          bunx prettier --write CHANGELOG.md docs/PROJECT-STATUS.yaml docs/CURRENT-STATUS.md docs/BSF-CURRENT-PRIORITIES.md docs/SPRINT-PLAN-MVP-BSF.md docs/ENTWICKLUNGSTAGEBUCH.md src/lib/help-navigation-topics.ts docs/BSF-03-CLOSURE-2026-09-13.md docs/BSF-03-RESPONSIBILITY-MANAGEMENT-READ-CONTRACT-2026-09-13.md
          bun run docs:check
          bun run project-status:check
          bun run typecheck
      - name: Commit closure sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/PROJECT-STATUS.yaml docs/CURRENT-STATUS.md docs/BSF-CURRENT-PRIORITIES.md docs/SPRINT-PLAN-MVP-BSF.md docs/ENTWICKLUNGSTAGEBUCH.md src/lib/help-navigation-topics.ts docs/BSF-03-CLOSURE-2026-09-13.md docs/BSF-03-RESPONSIBILITY-MANAGEMENT-READ-CONTRACT-2026-09-13.md
          git diff --cached --check
          git commit -m "docs(bsf03): Kundensicht auf 1.61.0 abschließen"
          git push origin HEAD:feat/bsf03-p5-responsibility-management
