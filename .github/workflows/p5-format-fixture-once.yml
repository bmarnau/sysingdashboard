name: P5 Format Fixture Once

on:
  push:
    branches:
      - feat/bsf03-p5-responsibility-management
    paths:
      - .github/workflows/p5-format-fixture-once.yml

permissions:
  contents: write

jobs:
  format-fixture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf03-p5-responsibility-management
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format exactly the P5 E2E fixture
        run: bunx prettier --write e2e/fixtures/customer-responsibility-management-e2e.ts
      - name: Verify fixture formatting
        run: bunx prettier --check e2e/fixtures/customer-responsibility-management-e2e.ts
      - name: Commit formatted fixture and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p5-format-fixture-once.yml
          git add e2e/fixtures/customer-responsibility-management-e2e.ts
          git diff --cached --check
          git commit -m "style(bsf03): P5 E2E-Fixture formatieren"
          git push origin HEAD:feat/bsf03-p5-responsibility-management
