name: P5 Format Once

on:
  push:
    branches:
      - feat/bsf03-p5-responsibility-management
    paths:
      - .github/workflows/p5-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bsf03-p5-responsibility-management
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format only CI-reported P5 files
        run: |
          bunx prettier --write \
            docs/superpowers/plans/2026-09-13-bsf03-p5-responsibility-management.md \
            e2e/fixtures/customer-responsibility-management-e2e.ts \
            e2e/specs/security/customer-responsibility-management.spec.ts \
            src/components/customers/CustomerResponsibilityManagementView.tsx \
            src/integrations/supabase/customer-responsibility-management-adapter.ts \
            src/routes/_authenticated/kundenverantwortung/index.tsx
      - name: Commit formatter-only diff
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/superpowers/plans/2026-09-13-bsf03-p5-responsibility-management.md \
            e2e/fixtures/customer-responsibility-management-e2e.ts \
            e2e/specs/security/customer-responsibility-management.spec.ts \
            src/components/customers/CustomerResponsibilityManagementView.tsx \
            src/integrations/supabase/customer-responsibility-management-adapter.ts \
            src/routes/_authenticated/kundenverantwortung/index.tsx
          if git diff --cached --quiet; then
            echo "No formatter changes required."
          else
            git commit -m "style(bsf03): P5 Dateien formatieren"
            git push origin HEAD:feat/bsf03-p5-responsibility-management
          fi
