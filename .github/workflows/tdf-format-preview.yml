name: TDF Format Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format_preview:
    name: TDF format preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format target Markdown and print reproducible payloads
        run: |
          bunx prettier --write \
            docs/superpowers/plans/2026-09-23-sysing-kiosk-001-tdf.md \
            docs/SYSING-KIOSK-001_Info-Kiosk-Datenschnittstelle_V1.0.0.md
          echo "PLAN_BASE64_BEGIN"
          base64 -w 0 docs/superpowers/plans/2026-09-23-sysing-kiosk-001-tdf.md
          echo
          echo "PLAN_BASE64_END"
          echo "DOC_BASE64_BEGIN"
          base64 -w 0 docs/SYSING-KIOSK-001_Info-Kiosk-Datenschnittstelle_V1.0.0.md
          echo
          echo "DOC_BASE64_END"
