name: TDF Format Preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format_preview:
    name: TDF format preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format checker and print payload
        run: |
          bunx prettier --write scripts/docs/check-sysing-kiosk-001.mjs
          echo "CHECK_BASE64_BEGIN"
          base64 -w 0 scripts/docs/check-sysing-kiosk-001.mjs
          echo
          echo "CHECK_BASE64_END"
