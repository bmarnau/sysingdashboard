name: TEMP BSF02C Prettier

on:
  push:
    branches:
      - docs/bsf-02c-shared-projection-architecture-2026-08-25

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/bsf-02c-shared-projection-architecture-2026-08-25
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format ADR index with repository Prettier
        run: bunx prettier --write docs/ADR/README.md
      - name: Commit formatter result only
        run: |
          if git diff --quiet -- docs/ADR/README.md; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ADR/README.md
          git commit -m "style(bsf-02c): apply exact Prettier output to ADR index"
          git push origin HEAD:docs/bsf-02c-shared-projection-architecture-2026-08-25