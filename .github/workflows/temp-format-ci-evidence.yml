name: TEMP Format CI Evidence

on:
  push:
    branches:
      - fix/technical-report-current-ci-evidence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/technical-report-current-ci-evidence
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format current CI evidence script
        run: bunx prettier --write scripts/ci/write-current-ops-report.mjs
      - name: Commit formatter result only
        run: |
          if git diff --quiet -- scripts/ci/write-current-ops-report.mjs; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ci/write-current-ops-report.mjs
          git commit -m "chore(ci): format current evidence writer"
          git push origin HEAD:fix/technical-report-current-ci-evidence
