name: TEMP PORT01 Public Lock Candidate

on:
  push:
    branches:
      - audit/port-01-lockfile-portability-2026-08-25

permissions:
  contents: write

jobs:
  candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/port-01-lockfile-portability-2026-08-25
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Regenerate lockfile against public npm registry only
        run: |
          rm -rf node_modules "$HOME/.bun/install/cache" bun.lock
          BUN_CONFIG_REGISTRY=https://registry.npmjs.org bun install --lockfile-only --registry https://registry.npmjs.org
          test "$(grep -c 'lovable-core-prod/sandbox-npm-cache' bun.lock || true)" = "0"
      - name: Prove public frozen install and clean audit
        run: |
          rm -rf node_modules "$HOME/.bun/install/cache"
          BUN_CONFIG_REGISTRY=https://registry.npmjs.org bun install --frozen-lockfile --registry https://registry.npmjs.org
          bun audit --json > /tmp/port01-audit.json
          cat /tmp/port01-audit.json
          test "$(cat /tmp/port01-audit.json)" = "{}"
      - name: Commit lockfile candidate only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(portability): regenerate bun lockfile from public npm registry"
          git push origin HEAD:audit/port-01-lockfile-portability-2026-08-25
