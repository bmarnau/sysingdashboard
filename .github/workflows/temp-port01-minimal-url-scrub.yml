name: TEMP PORT01 Minimal URL Scrub

on:
  push:
    branches:
      - audit/port-01-minimal-url-scrub-2026-08-25

permissions:
  contents: write

jobs:
  scrub:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/port-01-minimal-url-scrub-2026-08-25
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Replace only Lovable tarball URLs with default-registry marker
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('bun.lock')
          s = p.read_text()
          pattern = r'"https://[^"\n]*lovable-core-prod/sandbox-npm-cache/[^"\n]*"'
          matches = re.findall(pattern, s)
          print(f'LOVABLE_URLS_BEFORE={len(matches)}')
          if len(matches) == 0:
              raise SystemExit('No Lovable tarball URLs found; unexpected baseline')
          out = re.sub(pattern, '""', s)
          p.write_text(out)
          remaining = out.count('lovable-core-prod/sandbox-npm-cache')
          print(f'LOVABLE_URLS_AFTER={remaining}')
          if remaining != 0:
              raise SystemExit('Lovable URLs remain after scrub')
          PY
          git diff --stat -- bun.lock
      - name: Prove same lockfile installs with Lovable hosts unavailable
        run: |
          rm -rf node_modules "$HOME/.bun/install/cache"
          echo '127.0.0.1 europe-west1-npm.pkg.dev' | sudo tee -a /etc/hosts
          echo '127.0.0.1 europe-west4-npm.pkg.dev' | sudo tee -a /etc/hosts
          bun install --frozen-lockfile
      - name: Audit scrubbed lockfile
        run: |
          set +e
          bun audit --json > /tmp/port01-scrub-audit.json
          code=$?
          echo "SCRUBBED_AUDIT_EXIT_CODE=$code"
          cat /tmp/port01-scrub-audit.json
          exit 0
      - name: Commit bun.lock only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(portability): remove Lovable registry URLs from bun lockfile"
          git push origin HEAD:audit/port-01-minimal-url-scrub-2026-08-25
