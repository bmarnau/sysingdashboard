name: TEMP SEC03 Dependency Audit

on:
  push:
    branches:
      - audit/sec-03-dependency-review-2026-08-25

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run dependency audit
        run: |
          set +e
          bun audit --json > sec03-audit.json 2> sec03-audit.stderr
          code=$?
          echo "AUDIT_EXIT_CODE=$code"
          cat sec03-audit.json || true
          cat sec03-audit.stderr || true
          exit 0
      - name: Dependency chains for vulnerable packages
        run: |
          set +e
          for pkg in '@babel/core' brace-expansion dompurify esbuild js-yaml nanoid postcss sharp undici; do
            echo "===== WHY: $pkg ====="
            bun pm why "$pkg" || true
          done
          exit 0
      - name: Audit fix dry run
        run: |
          set +e
          echo "===== bun audit fix --dry-run ====="
          bun audit fix --dry-run
          echo "DRY_RUN_EXIT_CODE=$?"
          exit 0
