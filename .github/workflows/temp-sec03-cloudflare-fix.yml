name: TEMP SEC03 Cloudflare Fix

on:
  push:
    branches:
      - sec/sec-03-cloudflare-upgrade-2026-08-25

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sec/sec-03-cloudflare-upgrade-2026-08-25
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install current lockfile
        run: bun install --frozen-lockfile
      - name: Upgrade Cloudflare Vite plugin only
        run: bun add @cloudflare/vite-plugin@1.53.1 --exact
      - name: Verify direct dependency scope
        run: |
          git diff -- package.json
          grep -q '"@cloudflare/vite-plugin": "1.53.1"' package.json
      - name: Verify resolved security chain and audit
        run: |
          bun pm why miniflare || true
          bun pm why sharp || true
          bun pm why undici || true
          bun audit --json > /tmp/sec03-audit.json
          cat /tmp/sec03-audit.json
          test "$(cat /tmp/sec03-audit.json)" = "{}"
      - name: Static and production build smoke
        run: |
          bunx prettier --check .
          bun run lint
          bun run typecheck
          bun run build
      - name: Commit package files only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "chore(security): upgrade Cloudflare Vite plugin"
          git push origin HEAD:sec/sec-03-cloudflare-upgrade-2026-08-25
