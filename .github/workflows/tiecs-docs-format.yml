name: TIECS Docs Format

on:
  push:
    branches:
      - "feat/bsf-03a-project-controlling"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format TIECS documentation files
        run: |
          bunx prettier --write             docs/ENTWICKLUNGSTAGEBUCH.md             docs/LOVABLE-PROMPT-PLAN-BSF-03A.md             docs/status-board.html
      - name: Remove temporary formatter workflow
        run: rm .github/workflows/tiecs-docs-format.yml
      - name: Commit exact formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ENTWICKLUNGSTAGEBUCH.md docs/LOVABLE-PROMPT-PLAN-BSF-03A.md docs/status-board.html .github/workflows/tiecs-docs-format.yml
          git diff --cached --quiet && exit 0
          git commit -m "style(docs): format TIECS continuity files"
          git push origin HEAD:feat/bsf-03a-project-controlling
