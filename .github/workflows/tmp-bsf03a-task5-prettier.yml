name: Temporary BSF-03A Task5 Prettier

on:
  push:
    branches:
      - tmp/bsf03a-task5-prettier

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/bsf03a-task5-prettier
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format only Task 5 RED test
        run: bunx prettier --write src/__tests__/integration/project-controlling-adapter.test.ts
      - name: Verify only test changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain | awk '{print $2}')"
          test "$changed" = "src/__tests__/integration/project-controlling-adapter.test.ts"
      - name: Commit formatted test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/__tests__/integration/project-controlling-adapter.test.ts
          git commit -m 'chore(tmp): format BSF-03A Task 5 RED test'
          git push origin HEAD:tmp/bsf03a-task5-prettier
