name: Temporary BSF-03A Task 7 Route Tree Generation

on:
  push:
    branches:
      - tmp/bsf03a-task7-route-tree

permissions:
  contents: write

jobs:
  generate-route-tree:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: tmp/bsf03a-task7-route-tree
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate route tree through project build tooling
        shell: bash
        run: |
          set -euo pipefail
          bun run build

          actual="$(git status --porcelain --untracked-files=no | awk '{print $2}' | sort)"
          expected="src/routeTree.gen.ts"
          test "$actual" = "$expected"

          git diff --check
          git diff -- src/routeTree.gen.ts

      - name: Commit generated route tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routeTree.gen.ts
          git commit -m 'chore(tmp): generate BSF-03A Task 7 route tree'
          git push origin HEAD:tmp/bsf03a-task7-route-tree

      - name: Final evidence
        shell: bash
        run: |
          set -euo pipefail
          git show --name-only --format= HEAD
          git hash-object src/routeTree.gen.ts
