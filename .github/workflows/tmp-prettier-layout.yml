name: Temporary Layout Prettier

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/avkk-management-table-title-overflow
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/components/avkk/management/ManagementTable.tsx
      - name: Commit formatter result when needed
        shell: bash
        run: |
          if git diff --quiet -- src/components/avkk/management/ManagementTable.tsx; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/avkk/management/ManagementTable.tsx
          git commit -m "style(ui): apply project Prettier to management table"
          git push origin HEAD:fix/avkk-management-table-title-overflow
