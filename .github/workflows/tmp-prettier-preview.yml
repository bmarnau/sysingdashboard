name: Temporary Prettier Preview

on:
  push:
    branches:
      - docs/avkk-responsibility-consequence-clarification

permissions:
  contents: write

jobs:
  format-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/avkk-responsibility-consequence-clarification
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format only the two CI findings
        run: bunx prettier --write docs/AVKK.md src/components/avkk/management/AvkkUnderstandPanel.tsx
      - name: Commit formatter result when needed
        shell: bash
        run: |
          if git diff --quiet -- docs/AVKK.md src/components/avkk/management/AvkkUnderstandPanel.tsx; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AVKK.md src/components/avkk/management/AvkkUnderstandPanel.tsx
          git commit -m "style(avkk): apply project Prettier"
          git push origin HEAD:docs/avkk-responsibility-consequence-clarification
