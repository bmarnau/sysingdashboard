name: Temporary Wallboard Prettier

on:
  push:
    branches:
      - docs/idea-management-wallboard-v050

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[prettier-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/idea-management-wallboard-v050
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format wallboard documentation with repository Prettier
        run: bunx prettier --write docs/ideas/management-wallboard

      - name: Commit formatting only when required
        shell: bash
        run: |
          if git diff --quiet -- docs/ideas/management-wallboard; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ideas/management-wallboard
          git commit -m "chore(docs): apply repository Prettier [prettier-applied]"
          git push origin HEAD:docs/idea-management-wallboard-v050
