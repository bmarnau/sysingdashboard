# ---------------------------------------------------------------------------
# Querschnittsthemen aus der Bestandsanalyse (2026-10-20)
# Sie erzeugen keine zusätzliche Hauptlinie; sie sind in L8 abnahmerelevant
# ("kein offener CRITICAL/HIGH-Befund") und werden vor L8 umgesetzt.
# ---------------------------------------------------------------------------
querschnitt:
  - id: QS-01
    titel: Konto- und Berechtigungsschutz (Sicherheitsplan)
    bezug: L8 Abnahme "kein offener CRITICAL/HIGH-Sicherheitsbefund"
    freigabe_voraussetzung: [S0-04]
    status: in_progress
    gates_pass: yes
    status_detail: >-
      Migration A (Profil-Selbstschutz) am 2026-10-22 16:55 MESZ live angewendet
      (ADR-0035-Pfad), per Postflight bestätigt; fachlicher Retest des Owners am 2026-10-24
      bestanden (Anzeigename, Sperren/Entsperren, An-/Abmeldung).
      Migration B und C folgen getrennt.
    befunde:
      - id: SEC-PROFILE-SELF-UPDATE
        beschreibung: >-
          Policy profiles_self_update ohne Spaltenbeschränkung; Nutzer können
          Konto-/Rollenfelder des eigenen Profils ändern.
        referenz: supabase/schema/public-schema.sql
      - id: SEC-ACTIVE-ACCOUNT
        beschreibung: Aktivitätsprüfung des Kontos fehlt in dieser Policy.
      - id: SEC-DEFAULT-ACL
        beschreibung: Default Privileges vergeben TRUNCATE an anon/authenticated.
      - id: SEC-AUDIT-ERRORS
        beschreibung: writeAudit ignoriert zurückgegebene Fehler.
        referenz: src/lib/admin/auth-accounts.server.ts
      - id: SEC-BOOTSTRAP-ADMIN
        beschreibung: >-
          Erste Registrierung wird Systemadministrator, solange keiner existiert.
        entscheidung: >-
          Erster Admin wird an die konfigurierte Admin-E-Mail gebunden;
          Selbstregistrierung bleibt offen und erfordert aktive E-Mail-Bestätigung.
    umsetzungsregeln:
      - >-
        Generierte Supabase-Typen aus Lovable (types.ts) nur übernehmen, wenn eine
        Migration sie deckt. Befund aus PR #194, Check Database Schema Drift,
        Fremdschlüssel reference_value_history_systemhouse_fk.
      - Trigger als SECURITY INVOKER (current_user + has_any_role); bei SECURITY DEFINER ist current_user der Owner.
      - "Migrationen getrennt (A: Profile/Trigger, B: Bootstrap, C: Default-ACL inkl. pg_default_acl-Inventar)."
      - ADR-0034/0035 und DATABASE-CHANGE-GOVERNANCE einhalten; keine Plattform-/Auth-Storage-Änderung.
      - Schema-Drift (u. a. reference_value_history_systemhouse_fk) vorab abgleichen.
    entschieden:
      - "Admin-E-Mail liegt in einem nicht öffentlichen app_settings-Eintrag (Nutzer, 2026-10-21)."
      - "QS-01 jetzt im Umfang (Nutzer, 2026-10-21)."
    offene_punkte:
      - Ist die E-Mail-Bestätigung im Hosting aktiv?
      - Lovable-Variant (S0-04) für die Datenbankmigrationen anlegen.

  - id: QS-02
    titel: Server-Backup (Local-First plus Server-Sicherung)
    entscheidung: RPO höchstens 15 Minuten nach Änderungen, ca. 30 Versionen Aufbewahrung.
    einordnung: >-
      Passt thematisch zu BSF-04 (zentrale Datenstrategie), das laut Reihenfolge
      nach dem Golden Gate geplant ist. In L8 ist nur Backup/Restore im
      bestehenden Umfang Pflicht.
    status: planned
    vor_golden_gate_erforderlich: no
    entscheidung_nutzer: "2026-10-21: QS-02 erst nach dem Golden Gate."

  - id: QS-03
    titel: Produktname "SysIng Dashboard" und Release-Hygiene
    inhalt:
      - Golden Gate bleibt interner Codename.
      - "Version 1.69.0 mit Changelog-Eintrag (Nutzer 2026-10-21; Minor wegen neuer Funktion)."
      - Sichtbare Titel und Kopfzeilen einheitlich SysIng Dashboard.
      - "Release-Tag v1.69.0 und GitHub-Release erst nach Publish-Go/No-Go (eigene Freigabe)."
    status: in_progress
    code_merged: yes
    gates_pass: yes
    referenz: PR #202 (main 8ecf9d2)

  - id: QS-04
    titel: Domain und Auth-Mail (sysingdashboard.de, SPF/DKIM/DMARC)
    referenz: docs/BACKLOG.md (Stand 2026-08-17)
    einordnung: Betriebsfähigkeit der Registrierung; Plattform-Mails sind für externe Empfänger unzuverlässig.
    vor_golden_gate_erforderlich: no
    entscheidung: "Nutzer 2026-10-21: QS-04 ist optional; Umfang reicht bis QS-03. Nutzer 2026-10-25: QS-04 wird nach dem Golden Gate umgesetzt (Empfehlung angenommen)."
    status: optional
    status_detail: >-
      Stand 2026-10-25 (Lovable-Bericht): Domain notify.berndmarnau.de ist bei Lovable verifiziert,
      aber keine eigenen Auth-Vorlagen vorhanden (Plattformstandard). Eigene Auth-Mails brauchen
      Repository-Code (Versandroute src/routes/lovable/email/auth/webhook.ts, sechs Vorlagen unter
      src/lib/email-templates/, drei neue Pakete) und damit einen Code-Auftrag mit Review. Lovable
      lehnte den Auftrag ab, weil keine freigegebene Variant mit festem base_sha nachgewiesen ist
      (S0-04). Die Entscheidung, QS-04 hochzustufen, steht aus.
  - id: QS-05
    titel: Systemstatus zeigt Abweichungen Datenbank, Git und Lovable
    einordnung: >-
      Der Systemstatus prüft heute Git gegen Build (Build-Commit gegen main-HEAD),
      nicht die Datenbank gegen die Migrationen. Der FK-Drift vom 2026-10-22 und der
      Lovable-Broker wären dort nicht aufgefallen.
    vor_golden_gate_erforderlich: no
    entscheidung: "Nutzer 2026-10-22: Paket in den Tracker aufnehmen."
    status: geplant
    abhaengigkeiten:
      - QS-01 Migration A angewendet (die Prüfung ist selbst eine Datenbankfunktion)
    anforderungen:
      - Der Systemstatus muss für Administratoren anzeigen, ob die angewendeten Migrationen der Datenbank mit dem im Build erwarteten Migrationsstand übereinstimmen (SYNCHRON, ABWEICHEND, NICHT PRÜFBAR).
      - Die Prüfung muss nur lesen und darf keine Konto-, Kunden- oder Geschäftsdaten ausgeben.
      - Die Prüfung muss serverseitig mit Rollenprüfung laufen; Nicht-Administratoren dürfen kein Ergebnis erhalten.
      - Der Systemstatus sollte anzeigen, wenn die Auth-Storage-Broker-Datei im Build enthalten ist.
      - Jede Abweichung muss mit Zeitpunkt der Prüfung und den abweichenden Migrationsnamen angezeigt werden.
    risiko: Eine neue Datenbankfunktion; Anwendung nur über den Governance-Pfad (eigene Migration, Variant).
    status_detail: noch nicht begonnen

