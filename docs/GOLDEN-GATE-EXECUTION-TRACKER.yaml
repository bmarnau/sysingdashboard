# ---------------------------------------------------------------------------
# Risiken und Single Points of Failure
# ---------------------------------------------------------------------------
risiken:
  - id: R-01
    titel: Lovable-Basis divergiert erneut von GitHub
    wirkung: Konflikte, blockierte Lovable-Arbeit
    gegenmassnahme: Nur Variants mit Exact-Tree-Bindung; keine Writes im Lovable-Hauptprojekt.
  - id: R-02
    titel: Unwiderrufliche Datenbankmigrationen
    gegenmassnahme: Getrennte Migrationen A/B/C, Governance-Prozess, Postflight und Advisor.
  - id: R-03
    titel: Cockpit ist größter noch nicht begonnener Block
    wirkung: Terminrisiko für alle abhängigen Pakete (L4, L5, L7)
    gegenmassnahme: Zuerst nur eine Managementfrage (L2), danach erweitern.
  - id: R-04
    titel: Einzelner Betreiber als SPoF für Freigaben und Supabase-Zugriff
    gegenmassnahme: Betreiberhoheit in BSF-06; bis dahin dokumentierter Exit-/Restore-Pfad.
  - id: R-05
    titel: Gelesene PASS-Statusanzeigen ohne Evidenz
    gegenmassnahme: Vier getrennte Statusfelder; PASS nur mit Exact-Head-Nachweis.
  - id: R-06
    titel: Gemeinsame Projektion ohne Bedienweg bleibt leer
    wirkung: Verantwortungen und Cockpit zeigen keine echten Daten; DUE-DROP in der UI nicht prüfbar
    gegenmassnahme: Paket L0b; bis dahin DUE-DROP nur als GATES_PASS, nicht PREVIEW_VERIFIED führen.
  - id: R-07
    titel: Lovable erzeugt den verbotenen Auth-Storage-Broker bei jeder Arbeitskopie neu
    wirkung: Lovable-Stand weicht von main ab; Variant nicht exakt an main gebunden; Gefahr, dass der Broker über Publish in Produktion gelangt
    gegenmassnahme: Variant-Ausnahme nur mit Prüfsummen-Allowlist (ADR-0036 Nachtrag); Merge nach main bleibt verboten (Test supabase-client-contract); vor Publish-Go klären, ob Lovable aus eigener Arbeitskopie oder aus main veröffentlicht (read-only Prüfung und Kriterien siehe docs/LOVABLE-PUBLISH-PRUEFUNG.md, Stand 2026-10-24); Anfrage an Lovable-Support.
    stand: >-
      Antwort des Lovable-Supports am 2026-10-30 (Lea, Mitarbeiterin): Broker ist Plattform-Absicht, pro Projekt nicht abschaltbar;
      Publish deployt immer den Lovable-Projektstand (nicht main, kein Pinning); laut Support keine Wirkung außerhalb der Editor-Preview
      (von uns nicht gemessen). Entscheidung 2026-10-30: Weg B (Helper nach Anleitung des Supports entfernen), Weg A (Helper im
      Vertragstest erlauben, ADR-0036) als Rückfall. Publish bleibt No-Go bis Weg B oder A entschieden und nachgewiesen ist.
      Befund 2026-10-31 (Weg 1, Prüfung der veröffentlichten App): Das ausgelieferte Bundle (index-B1N4K92k.js, App 1.69.0) enthält die Broker-Funktion
      (Kennungen lovable-preview-auth:get, set, remove, result); der Broker ist in der veröffentlichten App also bereits vorhanden. Er greift laut Quelltext nur
      im Editor-Rahmen mit Projekt-ID im Hostnamen, sonst localStorage (aus dem Quelltext gelesen, nicht im Betrieb gemessen). Veröffentlichungszeitpunkt und
      Commit sind nicht ermittelbar. Ein Publish des Weg-B-Stands würde den Broker entfernen. Messung angemeldet (2026-10-31): Sitzung
      liegt im localStorage, nicht eingebettet, keine Projekt-ID im Host, Broker-Pfad inaktiv. Publish bleibt No-Go bis zur Freigabe des Owners.
  - id: R-08
    titel: Live-Datenbank weicht von den Migrationen ab (FK reference_value_history_systemhouse_fk)
    wirkung: Neuaufbau aus Migrationen liefert ein anderes Schema als Produktion
    gegenmassnahme: >-
      Entscheidung 2026-10-24: Draft-PR 210 wird als reiner Git-Nachzug gemergt und
      nicht live angewendet (FK existiert live bereits, Katalogprüfung 2026-10-22).
      Umgesetzt: PR 210 gemergt am 2026-10-24 (main 78999c6); in Git geschlossen.
  - id: R-09
    titel: Kein Bereitstellungspfad für die erste Systemhaus-Mitgliedschaft; Mandantentabellen live leer
    wirkung: L0b und L2 nicht praktisch testbar; Veröffentlichen scheitert mit "Keine aktive Systemhaus-Zugehörigkeit"
    gegenmassnahme: Paket L0c (synthetischer Demo-Mandant über freigegebenen Einzelauftrag); danach TD-01.
    stand: Demo-Mandant am 2026-10-24 angelegt; ein dauerhafter Bereitstellungspfad für echte Mandanten fehlt weiterhin.
  - id: R-10
    titel: Migrationshistorie der Live-Datenbank hat Lücken (20260913213000, 20260917182000, 20260917190000) und leere Statements
    wirkung: Objekte sind live vorhanden, der History-Nachweis fehlt; zehn Live-Einträge ohne gespeicherte Statements; ein Werkzeug könnte die Versionen als pending führen
    gegenmassnahme: >-
      Entscheidung 2026-10-24: nur dokumentieren, kein Repair; diese Migrationen nie
      anwenden. Lovable-Support-Anfrage (Statements, Aliasversionen) bei R-07 bündeln.
  - id: R-11
    titel: Terminrisiko durch knappe Kapazität des Betreibers
    wirkung: >-
      26 bis 43 Arbeitstage bis zur Internen Freigabe 1.0 bei 1 bis 2 Arbeitstagen pro Woche
      (grob 2 bis 6 Monate, Analogieschätzung); Wartezeiten auf den Lovable-Support kommen hinzu.
    gegenmassnahme: >-
      Reihenfolge nach ADR-0038: Publish-Freischaltung (R-07) zuerst. Tempo nach drei Paketen
      am Arbeitstag neu messen und die Schätzung anpassen.
    betroffene_pakete: L2 bis L8
    stand: offen

  - id: R-12
    titel: Abhängigkeit von der Lovable-Plattform (Credits, Plattform-Änderungen, Sync-Dialoge)
    wirkung: >-
      Credits verfallen ohne tägliche Nutzung; die Plattform ändert Dateien (types.ts +5 Zeilen) und legt Sync-Branches an; Dialoge nach Merges können
      Repository-Stand überschreiben, wenn sie falsch beantwortet werden.
    gegenmassnahme: >-
      Täglicher lesender Lovable-Prompt (geplante Aufgabe 07:17); nach Merges Dialog "Repository-Version behalten", danach Re-check; lovable-sync-Branches nie mergen;
      Standard-Eintrag "Lovable-Grenzen" (Backlog).
    stand: beobachten
  - id: R-13
    titel: Branch-Wildwuchs erschwert Überblick und Aufräumen
    wirkung: 30 lovable-sync-Branches und rund 40 Remote-Branches ohne gemergten PR; Löschen von Remote-Branches ist in der Cloud-Sitzung gesperrt.
    gegenmassnahme: Hygiene-Zeile zum Tagesabschluss; lokaler Aufräumauftrag docs/GIT-AUFRAEUMEN.md bei mehr als 10 gemergten Remote-Branches; lovable*, backup/* und audit/* nie löschen.
    stand: beobachten
  - id: R-14
    titel: Kein Nachweis für Wiederherstellung von Daten, Konfiguration und Schema
    wirkung: >-
      Aus Git ist der Code neu aufbaubar, nicht aber die Live-Daten in Lovable Cloud (Mandanten, Benutzerkonten, Rollen, Einstellungen), Secrets, Auth- und
      Domain-Konfiguration. Das Schema ist wegen der Lücken der Migrationshistorie (R-10) aus den Migrationen nicht als identisch nachgewiesen. Ein Restore-Pfad
      als Dokument liegt nicht vor (R-04 nennt ihn als Gegenmaßnahme).
    gegenmassnahme: >-
      Entscheidung des Owners 2026-11-02: Datenexport und Wiederherstellungsprobe in einer zweiten Umgebung sind Gate vor dem ersten Publish (Vorgriff auf L8). Dazu
      kommt ein dokumentierter Restore-Pfad (R-04). QS-02 (Server-Backup) bleibt nach dem Golden Gate.
    stand: offen

