# Golden Gate – Ausführungsverfolgung (Execution Tracker)
#
# Zweck: maschinenlesbare Fortschrittsverfolgung zu
#   docs/GOLDEN-GATE-DELIVERY-PLAN-2026-10-16.md (Liefersteuerung) und
#   Issue #175 (Ziel/Scope).
# Dieses Dokument ändert weder Ziel noch Reihenfolge dieser Quellen und ist
# keine zweite Roadmap. Es bildet pro Lieferpaket den Ist-Status ab und trägt
# die Querschnittsthemen, die aus der Bestandsanalyse vom 2026-10-20 folgen.
# Maßgeblich bei Widerspruch: Delivery Plan > Tracker.

schema_version: 1
document: golden-gate-execution-tracker
stand: 2026-10-24
base_main_sha: fd8aa71bbe98e6d265fcc9abbfce557a72ac2bf8
repository: bmarnau/sysingdashboard
tracker_issue: 175
reifegrad: Entwurf
einheit_der_schaetzung: Arbeits-/Promptbudget, keine Termin- oder Erfolgszusage

# Vier getrennte Statusfelder je Paket (Delivery Plan, Abschnitt 2, Punkt 3).
# Ein Feld ersetzt niemals ein anderes.
status_felder:
  CODE_MERGED: [yes, no]
  GATES_PASS: [yes, no, blocked, not_run]
  PREVIEW_VERIFIED: [yes, no, blocked, not_applicable]
  PUBLISHED_VERIFIED: [yes, no, not_published]

paket_status: [done, in_progress, planned, blocked]

# ---------------------------------------------------------------------------
# Sprint 0: Basis klären (Voraussetzung für alle weiteren Pakete)
# ---------------------------------------------------------------------------
sprint_0:
  ziel: >-
    GitHub main und Lovable-Projekt auf einen gemeinsamen, geprüften Stand
    bringen, damit Lovable-Varianten an einen verifizierten Base-SHA gebunden
    werden können.
  warum: >-
    Lovable arbeitet laut Meldung auf dem Sync-Branch lovable-sync-1792500399
    (11 Commits vor GitHub). Ohne gemeinsame Basis entstehen Konflikte, und
    schreibende Lovable-Arbeit ist gemäß AI-ASSISTED-DEVELOPMENT-WORKFLOW
    nicht zulässig.
  pakete:
    - id: S0-01
      titel: Fix DUE-DROP (due/categoryKey im Publish-Schema)
      referenz: PR #192, Commit 1efbb23, main 3acabae
      status: done
      code_merged: yes
      gates_pass: yes
    - id: S0-02
      titel: Fix CONTROLLING-FILTER (Filterleiste in allen Zuständen)
      referenz: PR #192, Commit f7fe2ec, main 3acabae
      status: done
      code_merged: yes
      gates_pass: yes
    - id: S0-03
      titel: Sync-Branch lovable-sync-1792520819 per Merge-Commit nach main
      regel: Kein Squash und kein Rebase (Hinweis der Lovable-GitHub-Integration).
      abhaengig_von: [S0-01, S0-02]
      status: done
      code_merged: yes
      gates_pass: yes
      referenz: PR #194, main 6e7219a
      hinweis: >-
        Der ursprüngliche Branch lovable-sync-1792500399 wurde von Lovable
        gesichert und als lovable-sync-1792520819 wiederhergestellt. Übernommen:
        Konfigurations-Upgrade 2.26.5, Lockfile, .lovable/plan.md. Nicht
        übernommen: Preview-Auth-Broker (verboten per Contract-Test),
        veralteter Roadmap-Block, generierte Typen (Schema-Drift).
    - id: S0-04
      titel: Lovable-Variant auf neuem main-SHA anlegen
      abhaengig_von: [S0-03]
      status: planned
      akteur: Nutzer (Lovable-Oberfläche)
    - id: S0-05
      titel: Zeitzonen-abhängige Tests in time-period.test.ts beheben (TEST-TZ)
      prioritaet: P3
      status: planned
      hinweis: 4 Fehlschläge außerhalb UTC, identisch auf fd8aa71; unabhängig von S0-01/02.

