# Vier getrennte Statusfelder je Paket (Delivery Plan, Abschnitt 2, Punkt 3).
# Ein Feld ersetzt niemals ein anderes.
status_felder:
  CODE_MERGED: [yes, no]
  GATES_PASS: [yes, no, blocked, not_run]
  PREVIEW_VERIFIED: [yes, no, blocked, not_applicable]
  PUBLISHED_VERIFIED: [yes, no, not_published]

paket_status: [done, in_progress, planned, blocked]

# ---------------------------------------------------------------------------
# Sprint 0: Basis klären (Voraussetzung für alle weiteren Pakete)
# ---------------------------------------------------------------------------
sprint_0:
  ziel: >-
    GitHub main und Lovable-Projekt auf einen gemeinsamen, geprüften Stand
    bringen, damit Lovable-Varianten an einen verifizierten Base-SHA gebunden
    werden können.
  warum: >-
    Lovable arbeitet laut Meldung auf dem Sync-Branch lovable-sync-1792500399
    (11 Commits vor GitHub). Ohne gemeinsame Basis entstehen Konflikte, und
    schreibende Lovable-Arbeit ist gemäß AI-ASSISTED-DEVELOPMENT-WORKFLOW
    nicht zulässig.
  pakete:
    - id: S0-01
      titel: Fix DUE-DROP (due/categoryKey im Publish-Schema)
      referenz: PR #192, Commit 1efbb23, main 3acabae
      status: done
      code_merged: yes
      gates_pass: yes
    - id: S0-02
      titel: Fix CONTROLLING-FILTER (Filterleiste in allen Zuständen)
      referenz: PR #192, Commit f7fe2ec, main 3acabae
      status: done
      code_merged: yes
      gates_pass: yes
    - id: S0-03
      titel: Sync-Branch lovable-sync-1792520819 per Merge-Commit nach main
      regel: Kein Squash und kein Rebase (Hinweis der Lovable-GitHub-Integration).
      abhaengig_von: [S0-01, S0-02]
      status: done
      code_merged: yes
      gates_pass: yes
      referenz: PR #194, main 6e7219a
      hinweis: >-
        Der ursprüngliche Branch lovable-sync-1792500399 wurde von Lovable
        gesichert und als lovable-sync-1792520819 wiederhergestellt. Übernommen:
        Konfigurations-Upgrade 2.26.5, Lockfile, .lovable/plan.md. Nicht
        übernommen: Preview-Auth-Broker (verboten per Contract-Test),
        veralteter Roadmap-Block, generierte Typen (Schema-Drift).
    - id: S0-04
      titel: Lovable-Variant auf neuem main-SHA anlegen
      abhaengig_von: [S0-03]
      status: done
      hinweis: >-
        Owner-Entscheidung 2026-10-31: Der heutige Lovable-Stand (main plus types.ts, ohne Broker, in Sync) genügt, eine zweite Lovable-Kopie wird nicht angelegt.
      akteur: Nutzer (Lovable-Oberfläche)
    - id: S0-06
      titel: Auth-Broker aus dem Lovable-Projektstand entfernen (Weg B)
      status: done
      akteur: Nutzer (Freigabe) und Lovable-Oberfläche; Vorprüfung durch Claude Code
      abhaengig_von: [Freigabe Owner, Sync-Stand, Prüfung des Branches lovable-sync-1793295874]
      hinweis: >-
        Nach Anleitung des Lovable-Supports (2026-10-30): Import in client.ts entfernen, Auth-Speicher-Zeile ändern (z. B. storage: window.localStorage),
        previewAuthStorage.ts löschen, eine kleine Änderung in Lovable machen und prüfen, dass die Dateien nicht zurückkommen. Ungetestet am Projekt.
        Rückfall Weg A: Hilfsdatei im Vertragstest erlauben (ADR-0036 ändern, Wirkungslosigkeit in der veröffentlichten App prüfen).
        Mechanismus: Die Plattform schreibt client.ts nur bei Originalform um. Teil 1 (2026-10-31): Speicher-Zeile auf
        window.localStorage mit unveränderter Schutzabfrage, Vertragstest 2 auf die neue Form. Teil 1 gemergt (PR 253). Beobachtung 2026-10-31: Lovable-Projektstand ohne Broker,
        client.ts mit der neuen Zeile; neuer Sync-Branch lovable-sync-1793429000 weicht nur in types.ts (+5 Zeilen) von main ab. Kontrollmessung 2026-10-31 (Prompt B und C): nach einer README-Änderung in Lovable bleibt client.ts unverändert, kein Broker (Branch lovable-sync-1793441453). Offen: Publish-Quelle belegen, Dauerbeobachtung.
      beleg: Branch fix/s0-06-auth-storage-form, PR (siehe Fortschritt 2026-10-31), docs/LOVABLE-PUBLISH-PRUEFUNG.md (Weg B Umsetzung)
    - id: S0-05
      titel: Zeitzonen-abhängige Tests in time-period.test.ts beheben (TEST-TZ)
      prioritaet: P3
      status: done
      hinweis: >-
        Gemergt mit PR 245 (Merge-Commit b5ffc5f, CI 15 von 15). Tests formatieren lokale Kalendertage ohne toISOString;
        sumActivitiesInRange und buildChartBuckets werten Datumstexte YYYY-MM-DD als lokalen Kalendertag aus. Bericht: docs/BERICHT-2026-10-28-S0-05-AUFRAEUMEN-MERGE.md.
      auftrag: docs/AUFTRAG-S0-05-ZEITZONEN-TESTS.md (Berlin 4 Fehlschläge testseitig, New York 2 Fehlschläge produktseitig, reproduziert 2026-10-28)

