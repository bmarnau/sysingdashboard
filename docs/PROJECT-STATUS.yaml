      description: "Serverseitige Sitzungsdurchsetzung ist noch nicht vollständig umgesetzt."
      reference: "ADR-0020"
      targetSprint: "06"
    - id: "session-e2e"
      status: "unverified"
      severity: "medium"
      description: "Echter E2E-Test der automatischen Abmeldung benötigt eine kontrollierte Supabase-Testsession."
      reference: "ADR-0020"
      targetSprint: "06"

platforms:
