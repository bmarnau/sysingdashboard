backlog:
  - id: "BACKLOG-ARCH-002"
    title: "Backupformat 2.0 – Manifestbasierte Storage-Key-Zuordnung"
    category: "architecture"
    priority: "high"
    status: "completed-in-sprint-06A"
    problem: >-
      Die Restore-Logik rekonstruierte Storage-Keys aus maskierten Dateinamen.
      Das war funktional getestet, aber kein stabiler Austauschvertrag.
    targetOutcome: >-
      Eine versionierte entries[]-Struktur beschreibt jede Backupdatei explizit
      einschließlich logicalName, storageKey, checksum, size und contentType.
  - id: "BACKLOG-ARCH-003"
    title: "Automatisierte Layer-Architekturregeln"
    category: "architecture"
    priority: "medium"
    status: "partially-completed-in-sprint-06B"
    problem: >-
      Layerverstöße werden bislang nur nachträglich durch den Tech-Debt-Detektor
      gemeldet, nicht bereits beim Linten verhindert.
    targetOutcome: >-
