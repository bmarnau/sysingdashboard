schemaVersion: "1.2.0"
lastUpdated: "2026-08-06"

project:
  name: "Sysing Dashboard"
  repository: "https://github.com/bmarnau/sysingdashboard"
  productionApp: "https://sysingdashboard.lovable.app"
  localWorkspace: "C:\\Users\\bmarn\\OneDrive\\HTML\\sysingdashboard"
  sourceOfTruth: "github"
  lifecyclePhase: "mvp-hardening"
  description: >-
    Persönliches Arbeits-, Reporting- und zukünftiges Management-Dashboard
    für Systemingenieure mit sicherer Authentifizierung, rollenbasiertem Zugriff,
    nachvollziehbaren Prüfberichten und späterer Microsoft-365-, Azure- und
    KI-Integration.

vision:
  statement: >-
    Das Sysing Dashboard soll Tätigkeiten, Arbeitspakete, Projekte, Zeiten,
    Verantwortlichkeiten und Berichte in einer zentralen, verlässlichen und
    sicher betreibbaren Anwendung zusammenführen.
  targetState:
    - "Persönliches Arbeitsdashboard"
    - "Strukturierte Arbeits- und Managementinformationen"
    - "Supabase als führende MVP-Plattform"
    - "RBAC- und RLS-konforme Mehrbenutzerfähigkeit"
    - "Docker-fähiger autonomer Betrieb"
    - "Spätere Microsoft-Entra-ID-Anbindung"
    - "Spätere Azure-SQL- und Azure-Table-Anbindung"
    - "Spätere Microsoft-365-, SharePoint- und KI-Integration"

architecturePrinciples:
  - id: "source-of-truth"
    rule: "GitHub ist die maßgebliche Quelle für Code, Dokumentation und Versionsstand."
  - id: "supabase-mvp"
    rule: "Supabase ist die führende Daten- und Authentifizierungsplattform des MVP."
  - id: "provider-separation"
    rule: "Fachlogik, Authentifizierung, Datenzugriff und providerspezifische Implementierungen sind getrennt."
  - id: "portable-runtime"
    rule: "Lovable Cloud darf keine technisch unersetzbare Laufzeitabhängigkeit sein."
  - id: "container-ready"
    rule: "Die Anwendung muss langfristig als Docker-Container autonom betreibbar sein."
  - id: "security-by-design"
    rule: "Änderungen müssen sicher, testbar, dokumentiert sowie RBAC- und RLS-konform sein."
  - id: "no-secrets"
    rule: "Keine produktiven Schlüssel, Tokens, Passwörter oder Service-Role-Keys in Code, Prompts oder Dokumentation."

versions:
  dashboard: "1.49.0"
  projectManifestSchema: "1.2.0"
  technicalReportSchema: "2.0.0"
  technicalReportVersion: 5
  backupFormat: "2.0"
  backupManifestTarget: "2.0"
  api: "not-versioned"
  databaseSchema: "managed-by-supabase-migrations"

currentState:
  currentSprint: "06B"
  currentSprintTitle: "Project Governance, Architekturkonsolidierung und Project Manifest"
  previousSprint: "06A"
  previousSprintStatus: "completed"
  releaseReadiness: "passed-with-findings"
  testsPassing: 368
  qualityGates:
    typecheck: "passed"
    docsCheck: "passed"
    noConsole: "passed"
    projectStatusCheck: "passed"
    build: "not-recorded-in-manifest"
  knownVerificationLimits:
    - id: "session-server-enforcement"
      status: "open"
      severity: "medium"
      description: "Serverseitige Sitzungsdurchsetzung ist noch nicht vollständig umgesetzt."
      reference: "ADR-0020"
      targetSprint: "06"
    - id: "session-e2e"
      status: "unverified"
      severity: "medium"
      description: "Echter E2E-Test der automatischen Abmeldung benötigt eine kontrollierte Supabase-Testsession."
      reference: "ADR-0020"
      targetSprint: "06"

platforms:
  development:
    lovable:
      role: "Rapid UI- und Feature-Entwicklung"
      required: true
    github:
      role: "Maßgebliche Quelle für Code und Dokumentation"
      required: true
    localWorkspace:
      role: "Lokale Entwicklung mit Codex und VS Code"
      required: true
  runtime:
    current:
      - "Lovable App"
      - "Supabase"
    future:
      - "Docker"
      - "Microsoft Entra ID"
      - "Azure SQL"
      - "Azure Table Storage"
      - "Microsoft 365"

supabase:
  role: "Führende Authentifizierungs- und Datenplattform des MVP"
  projectRef: "to-be-verified-in-sprint-06"
  environments:
    local: "to-be-verified"
    preview: "to-be-verified"
    production: "to-be-verified"
  auth:
    status: "implemented-needs-production-verification"
    providers:
      - "email-password"
  rbac:
    status: "implemented-needs-real-user-verification"
  rls:
    status: "implemented-needs-real-user-verification"
  secretsPolicy: "Public client values only in frontend; no service-role key in client or documentation."

