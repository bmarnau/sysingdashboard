      - "Microsoft Entra ID"
      - "Azure SQL"
      - "Azure Table Storage"
      - "Microsoft 365"

supabase:
  role: "Führende Authentifizierungs- und Datenplattform des MVP"
  projectRef: "to-be-verified-in-sprint-06"
  environments:
    local: "to-be-verified"
    preview: "to-be-verified"
    production: "to-be-verified"
  auth:
    status: "implemented-needs-production-verification"
    providers:
      - "email-password"
  rbac:
    status: "implemented-needs-real-user-verification"
  rls:
    status: "implemented-needs-real-user-verification"
  secretsPolicy: "Public client values only in frontend; no service-role key in client or documentation."

phases:
  - id: "phase-1"
    number: 1
    title: "Technische Plattform"
    status: "completed"
    startedVersion: "1.0.0"
    completedVersion: "1.50.0"
    goal: >-
      Sichere, test- und nachweisgestützte Plattform: Auth, RBAC, RLS, Backup 2.0,
      Prüfberichte, Governance und Projektmanifest.
    outcomes:
      - "Supabase-Auth mit RBAC und RLS in Betrieb"
      - "Backupformat 2.0 mit manifestbasierter Restore-Zuordnung"
      - "Technischer Prüfbericht Schema 2.0 mit Integritätsnachweis"
      - "Project Governance und maschinengeprüftes Projektmanifest"
      - "CI-Qualitätsgates inklusive Manifest- und Doku-Prüfung"
  - id: "phase-2"
    number: 2
    title: "AVKK-Fachmodell"
    status: "in-progress"
    startedVersion: "1.50.0"
    goal: >-
      Fachliche Entwicklung auf der abgeschlossenen Plattform, beginnend mit dem
      AVKK-Datenmodell und der AVKK-Arbeitsansicht.
    outcomes:
      - "AVKK als Führungsmodell dokumentiert (docs/AVKK.md, ADR-0024)"

completedSprints:
  - id: "05"
    title: "Architektur-Refactoring"
    version: "1.44.0"
    status: "completed"
    summary: "Dashboard und Exportdialog modularisiert."
  - id: "05B"
    title: "Prüfbericht, PDF-Druck und Logger-Bereinigung"
    version: "1.44.3"
    status: "completed"
    summary: "Vollständiger PDF-Druck, Logger-Bereinigung und Prüfbericht-Verifikation."
  - id: "05C"
    title: "Konfigurierbare automatische Abmeldung"
    version: "1.45.0"
    status: "completed"
    summary: "Inaktivitätstimeout, Warnung, Logout und Dokumentation umgesetzt."
  - id: "05D"
    title: "Entwicklungstagebuch"
    version: "1.46.0"
    status: "completed"
    summary: "Entwicklungstagebuch als einzige Quelle und Anzeige unter Service integriert."
  - id: "05E"
    title: "Modularisierung Backup-Service"
    version: "1.47.0"
    status: "completed"
    summary: "Backup-Service in 13 Module zerlegt; öffentliche API unverändert."
  - id: "06A"
    title: "Backupformat 2.0 und manifestbasierte Restore-Zuordnung"
    version: "1.48.0"
    status: "completed"
    summary: "Manifest 2.0 mit entries[], Prüfsummen und manifestbasiertem Restore; Altformat lesbar."
  - id: "06B"
    title: "Project Governance, Architekturkonsolidierung und Project Manifest"
    version: "1.49.0"
    status: "completed"
    summary: >-
      Governance, Projektmanifest mit Schema und Validator, CI-Gate, Layer-Trennung
      der Persistenz sowie Finalisierung: Architekturdokument, Dialog-Dokumentation,
      Validator-Tests und neu erzeugter Prüfbericht (v1.50.0).
  - id: "07A"
    title: "AVKK-Führungsmodell und Reference-Data-Architektur"
    version: "1.51.0"
    status: "completed"
    summary: >-
      AVKK als Führungsmethodik definiert, Datenmodell- und RBAC-Zielkonzept entworfen,
      Kontextindikatoren abgegrenzt und Reference Data als Plattformdienst festgelegt
      (ADR-0024). Keine Datenbankimplementierung.

