completedSprints:
  - id: "BSF-01"
    title: "Planungs- und Architekturbaseline für Kunden- und Leistungssicht"
    version: "1.59.6"
    status: "completed"
    summary: >-
      Providerneutraler Systemhaus-/Customer-Scope als (systemhouseId, customerId)
      festgelegt, minimale gemeinsame Daten-/Read-Basis als Voraussetzung für
      Kunden- und Leistungssichten bestimmt und PM-/Teamlead-Scopes getrennt.
  - id: "09C-9"
    title: "F-18 Read-only-Rollen im lokalen CRUD"
    version: "1.59.3"
    status: "completed"
    summary: "Lokales CRUD fuer Projekte, Arbeitspakete und Taetigkeiten an die bestehende RBAC-Matrix gebunden: UI-Gating plus defensive Berechtigungspruefung vor jeder Mutation. Viewer und Customer sind wieder strikt lesend; berechtigte Rollen unveraendert."
  - id: "09C-8"
    title: "Administrative Passwortsetzung (F-16)"
    version: "1.59.2"
    status: "completed"
    summary: "Servicebereich Backend & Auth-Konten erlaubt berechtigten Administratoren das Setzen eines neuen Passworts; Eigenkonto- und Systemadministratorschutz, Drosselung ueber Auditdaten, Pruefprotokoll ohne Passwort. F-17 (kein erzwungener Wechsel) bleibt akzeptiert."
  - id: "09C-7"
    title: "Zentraler Daten-Refresh"
    version: "1.59.0"
    status: "completed"
    summary: "Providerneutraler RefreshCoordinator mit Generationssignal, Refresh-Knopf in der Kopfzeile, Teilfehlerbehandlung und Single-Flight; ausschliesslich Lesepfade, kein Seiten-Neuladen."
  - id: "09C-6"
    title: "F-11 Demo-Personenzuordnung korrigiert"
    version: "1.58.9"
    status: "completed"
    summary: "Seed haengt Verantwortungen vorhandener Demofaelle auf die gewaehlte Persona um statt sie zu ueberspringen; Fehlversuche werden gemeldet; Dialoghinweis zum browsergebundenen lokalen Bestand."
  - id: "09C-5"
    title: "Passwort-Reset in der Kontoverwaltung"
    version: "1.58.8"
    status: "completed"
    summary: "Passwort-Reset-Mail je Auth-Konto ueber den regulaeren Wiederherstellungsablauf, serverseitige Berechtigungs- und Kontopruefung, Auditierung ohne Tokenwerte."
  - id: "09C-4"
    title: "Backend- und Auth-Administration im Dashboard"
    version: "1.58.7"
    status: "completed"
    summary: "Servicebereich fuer Backend-Status und Anmeldekonten ergaenzt, serverseitige Rollenpruefung und Auditierung, Befund F-15 zum fehlenden externen Betreiberzugang dokumentiert."
  - id: "09C-3"
    title: "AVKK UI Quick Check Behebung"
    version: "1.58.5"
    status: "completed"
    summary: "Initialisierung gespeicherter Kompetenzbewertungen im Detaildialog korrigiert, Beschriftungen von Verantwortung und Bewertung eindeutig gemacht, lange Aufgabentitel lesbar dargestellt."
  - id: "09C-2"
    title: "Nachpruefung F-11 Mehrbenutzer-Demoszenario"
    version: "1.58.3"
    status: "completed"
    summary: "Demo-Datensatz auf vier fiktive Personen verteilt, Kontozuordnung im Demo-Dialog, Mehrbenutzer-Abnahmematrix und Scope-Grenzen als Befunde dokumentiert."
  - id: "09C"
    title: "MVP Hardening und manuelle Abnahme"
    version: "1.58.2"
    status: "completed"
    summary: "Word-Fassung von SYSING-001 aus der Markdown-Quelle erzeugt und visuell geprueft, Rollen-Abnahmecheckliste erstellt, Befunde konsolidiert."
  - id: "09B"
    title: "MVP-Gesamtabnahme und Release Candidate"
    version: "1.58.1"
    status: "completed"
    summary: "Demo-Datensatz vervollstaendigt, ADRs konsolidiert, SYSING-001 ausgebaut, MVP-Abnahmebericht mit Freigabeentscheidung erstellt."
  - id: "05"
    title: "Architektur-Refactoring"
    version: "1.44.0"
    status: "completed"
    summary: "Dashboard und Exportdialog modularisiert."
  - id: "05B"
    title: "Prüfbericht, PDF-Druck und Logger-Bereinigung"
    version: "1.44.3"
    status: "completed"
    summary: "Vollständiger PDF-Druck, Logger-Bereinigung und Prüfbericht-Verifikation."
  - id: "05C"
    title: "Konfigurierbare automatische Abmeldung"
    version: "1.45.0"
    status: "completed"
    summary: "Inaktivitätstimeout, Warnung, Logout und Dokumentation umgesetzt."
  - id: "05D"
    title: "Entwicklungstagebuch"
    version: "1.46.0"
    status: "completed"
    summary: "Entwicklungstagebuch als einzige Quelle und Anzeige unter Service integriert."
  - id: "05E"
    title: "Modularisierung Backup-Service"
    version: "1.47.0"
    status: "completed"
    summary: "Backup-Service in 13 Module zerlegt; öffentliche API unverändert."
  - id: "06A"
    title: "Backupformat 2.0 und manifestbasierte Restore-Zuordnung"
    version: "1.48.0"
    status: "completed"
    summary: "Manifest 2.0 mit entries[], Prüfsummen und manifestbasiertem Restore; Altformat lesbar."
  - id: "06B"
    title: "Project Governance, Architekturkonsolidierung und Project Manifest"
    version: "1.49.0"
    status: "completed"
    summary: >-
      Governance, Projektmanifest mit Schema und Validator, CI-Gate, Layer-Trennung
      der Persistenz sowie Finalisierung: Architekturdokument, Dialog-Dokumentation,
      Validator-Tests und neu erzeugter Prüfbericht (v1.50.0).
  - id: "07A"
    title: "AVKK-Führungsmodell und Reference-Data-Architektur"
    version: "1.51.0"
    status: "completed"
    summary: >-
      AVKK als Führungsmethodik definiert, Datenmodell- und RBAC-Zielkonzept entworfen,
      Kontextindikatoren abgegrenzt und Reference Data als Plattformdienst festgelegt
      (ADR-0024). Keine Datenbankimplementierung.
  - id: "07B"
    title: "AVKK-Datenbank, Reference Data, Services und RBAC/RLS"
    version: "1.52.0"
    status: "completed"
    summary: >-
      AVKK- und Reference-Data-Tabellen produktiv migriert inklusive Grants, RLS,
      Audit-Triggern und Historie; Fachdienste mit Cache und Frühindikator umgesetzt;
      sechs Berechtigungen dreifach gespiegelt; Servicetests und Sicherheitstest ergänzt;
      avkk_can_write als begründete Ausnahme dokumentiert (ADR-0025).
  - id: "08"
    title: "Persönlicher AVKK-Arbeitsplatz"
    version: "1.53.0"
    status: "completed"
    summary: >-
      Dashboard-Tab "Mein AVKK" mit Aufgabenliste, Suche, Filtern, Kennzahlen und
      Detailansicht entlang A-V-K-K; Katalogauswahl aus Reference Data, Speichern
      ueber AvkkService; reine Ableitungslogik in src/lib/avkk/workspace.ts mit
      Vitest-Suite; manueller Abnahmetest dokumentiert. Offen: AVKK ist nicht Teil
      von Backup/JSON-Export (Blocker Sprint 09).
  - id: "09"
    title: "AVKK-Management-Cockpit und Fuehrungssicht"
    version: "1.55.0"
    status: "completed"
    summary: >-
      Rollengeschuetzte Fuehrungssicht mit Kennzahlen, Handlungsbedarf,
      Aufgabenuebersicht und Auswertungen zu Verantwortung, Kompetenz und
      Konsequenz. Drill-down von jeder Kennzahl auf den Sachverhalt, dokumentierte
      Priorisierungsregeln, keine personenbezogenen Ranglisten. Kontextindikatoren
      sind als getrennte Ebene konzipiert, aber nicht erhoben (ADR-0027).
  - id: "08B"
    title: "AVKK in Backup, Restore und JSON-Export"
    version: "1.54.0"
    status: "completed"
    summary: >-
      AVKK-Fuehrungsdaten und Katalogstand sind Teil jedes Backups (avkk.json,
      reference-data.json) und des JSON-Exports (Schema 1.1.0). Restore prueft die
      Daten vollstaendig, schreibt sie aber nicht in die Datenbank zurueck und
      weist verwaiste Bezuege als Quarantaene aus. Loeschstrategie und drei
      Sicherheitswarnungen bewertet und dokumentiert (ADR-0026).

