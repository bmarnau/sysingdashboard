    status: "next"
    priority: "high"
    goal: >-
      Lovable-, GitHub- und Supabase-Zuordnung, persönliches Auth-Konto,
      Profil, Rollen, RBAC, RLS, Preview und Produktion vollständig prüfen.
    dependencies:
      - "05E"
    exitCriteria:
      - "Persönliches Supabase-Auth-Konto verifiziert"
      - "Profil und Rolle eindeutig zugeordnet"
      - "Preview und Produktion geprüft"
      - "RBAC und RLS mit realen Testrollen verifiziert"
      - "Inbetriebnahmebericht erstellt"
  - id: "07B"
    title: "AVKK- und Reference-Data-Implementierung"
    status: "next"
    priority: "high"
    goal: >-
      Reference-Data- und AVKK-Tabellen produktiv anlegen, Services, RBAC-Permissions
      und RLS-Policies gemäß ADR-0024 umsetzen.
    dependencies:
      - "07A"
    exitCriteria:
      - "Kataloge und AVKK-Tabellen migriert, inklusive GRANTs und RLS-Policies"
      - "Reference-Data-Service mit Cache und Versionsausgabe verfügbar"
      - "AVKK-Permissions in RBAC-Matrix und Security-Suite ergänzt"
      - "Bestehende Statuswerte wertegleich nach Reference Data migriert"
  - id: "07"
    title: "AVKK-Datenmodell (UI und Arbeitsansicht)"
    status: "planned"
    priority: "high"
    goal: "AVKK als fachliche Erweiterung der bestehenden Arbeitspakete einführen."
    dependencies:
      - "06"
      - "06A"
    exitCriteria:
      - "Datenmodell dokumentiert und in docs/DATA-SCHEMA.md beschrieben"
      - "Migration inklusive RLS-Policies und Grants angelegt"
      - "Import-, Export- und Backupformat berücksichtigen AVKK"
  - id: "08"
    title: "AVKK-Arbeitsansicht"
    status: "planned"
    priority: "high"
    goal: "AVKK im persönlichen Arbeitsdashboard nutzbar machen."
    dependencies:
      - "07"
    exitCriteria:
      - "AVKK-Ansicht im Dashboard verfügbar und RBAC-gesteuert"
      - "Handbuchkapitel ergänzt"
      - "UI- und E2E-Tests grün"
  - id: "09"
    title: "AVKK-Management-Cockpit"
    status: "planned"
    priority: "medium"
    goal: "Rollenbasierte Führungssicht auf Verantwortungen, Kommunikation und Kontrollen bereitstellen."
    dependencies:
      - "08"
    exitCriteria:
      - "Führungssicht mit Kennzahlen und Filtern umgesetzt"
      - "Zugriff ausschließlich über Rollenrechte"
      - "Exportierbarer Managementbericht vorhanden"
  - id: "10"
    title: "Microsoft-365-Integration"
    status: "planned"
    priority: "medium"
    goal: "Outlook und SharePoint providerbasiert anbinden."
    dependencies:
      - "09"
    exitCriteria:
      - "Providerabstraktion ohne Fachlogik-Kopplung"
      - "Secrets ausschließlich serverseitig"
      - "Fehler- und Offlineverhalten dokumentiert"
  - id: "11"
    title: "Arbeitspaket-Assistent"
    status: "planned"
    priority: "medium"
    goal: "Zuweisungs-E-Mails erkennen und geprüfte Arbeitspaketentwürfe erzeugen."
    dependencies:
      - "10"
    exitCriteria:
      - "Entwürfe nur nach Benutzerbestätigung übernommen"
      - "Keine personenbezogenen Inhalte in Logs"
      - "Nachvollziehbare Protokollierung jeder Übernahme"

backlog:
  - id: "BACKLOG-ARCH-002"
    title: "Backupformat 2.0 – Manifestbasierte Storage-Key-Zuordnung"
    category: "architecture"
    priority: "high"
    status: "completed-in-sprint-06A"
    problem: >-
      Die Restore-Logik rekonstruierte Storage-Keys aus maskierten Dateinamen.
      Das war funktional getestet, aber kein stabiler Austauschvertrag.
    targetOutcome: >-
      Eine versionierte entries[]-Struktur beschreibt jede Backupdatei explizit
      einschließlich logicalName, storageKey, checksum, size und contentType.
  - id: "BACKLOG-ARCH-003"
    title: "Automatisierte Layer-Architekturregeln"
    category: "architecture"
    priority: "medium"
    status: "partially-completed-in-sprint-06B"
    problem: >-
      Layerverstöße werden bislang nur nachträglich durch den Tech-Debt-Detektor
      gemeldet, nicht bereits beim Linten verhindert.
    targetOutcome: >-
      ESLint-Regel `no-restricted-imports` verbietet UI-Direktimporte der
      Persistenz- und Azure-Interna bereits im Editor.
  - id: "BACKLOG-SEC-001"
    title: "Serverseitige Sitzungsdurchsetzung"
    category: "security"
    priority: "high"
    status: "planned-for-sprint-06"
    problem: "Der Inaktivitätstimeout wird clientseitig durchgesetzt."
    targetOutcome: "Serverseitige Sessiongrenzen und Sperrverhalten nachvollziehbar verifizieren."
  - id: "BACKLOG-TEST-001"
    title: "Supabase-E2E-Test mit kontrollierter Testsession"
    category: "testing"
    priority: "high"
    status: "planned-for-sprint-06"
    problem: "Der echte Browser-E2E-Test benötigt eine sichere Supabase-Testsession."
    targetOutcome: "Reproduzierbarer Login-, Timeout-, Logout- und RBAC-Test mit dediziertem Testkonto."

