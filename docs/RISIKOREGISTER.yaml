# Risikoregister Golden Gate (Interne Freigabe 1.0)
# Stand: 2026-11-02. Führend für Bewertung, Verantwortung und Prüfrhythmus.
# Beschreibung, Wirkung und Gegenmaßnahmen der Risiken R-01 bis R-14 stehen im Tracker
# (docs/GOLDEN-GATE-EXECUTION-TRACKER.yaml, Abschnitt risiken) und werden hier nicht wiederholt.
# L2-R1 bis L2-R5 stehen in docs/L2-COCKPIT-SCHNITT-KONZEPT.md (Abschnitt Risiken).
#
# Methode
#   w = Eintrittswahrscheinlichkeit 1 (unwahrscheinlich) bis 5 (praktisch sicher)
#   a = Auswirkung 1 (gering) bis 5 (Golden Gate oder Datenschutz gefährdet)
#   score = w * a; stufe: hoch ab 15, mittel 8 bis 14, niedrig bis 7
#   Die Bewertung ist eine Einschätzung von Claude (Analogie, keine Messung) und
#   gilt erst mit der Bestätigung des Owners (bestaetigt_durch_owner).
#   Wirkt ein Risiko auf mehrere Pakete, steht es unter betroffene_pakete.

version: 1
stand: 2026-11-02
bestaetigt_durch_owner: true
bestaetigung: "Owner 2026-11-02: R-04, R-11, R-07 und R-14 einzeln ohne Änderung übernommen; die übrigen Bewertungen gelten nach der vereinbarten Regel als bestätigt (Änderungen jederzeit möglich)."
abnahme_ablauf: "Owner 2026-11-02: die vier hoch bewerteten Risiken (R-04, R-11, R-07, R-14) werden einzeln durchgegangen; die übrigen gelten als bestätigt, wenn der Owner nichts ändert."
pruefrhythmus: "Bei jedem Tagesabschluss die Spalten status und nächste_prüfung durchsehen; Neubewertung nach jedem gemergten L2-Schritt und bei jeder Antwort des Lovable-Supports."
skala:
