# Beschreibung, Wirkung und Gegenmaßnahmen der Risiken R-01 bis R-14 stehen im Tracker
# (docs/GOLDEN-GATE-EXECUTION-TRACKER.yaml, Abschnitt risiken) und werden hier nicht wiederholt.
# L2-R1 bis L2-R5 stehen in docs/L2-COCKPIT-SCHNITT-KONZEPT.md (Abschnitt Risiken).
#
# Methode
#   w = Eintrittswahrscheinlichkeit 1 (unwahrscheinlich) bis 5 (praktisch sicher)
#   a = Auswirkung 1 (gering) bis 5 (Golden Gate oder Datenschutz gefährdet)
#   score = w * a; stufe: hoch ab 15, mittel 8 bis 14, niedrig bis 7
#   Die Bewertung ist eine Einschätzung von Claude (Analogie, keine Messung) und
#   gilt erst mit der Bestätigung des Owners (bestaetigt_durch_owner).
#   Wirkt ein Risiko auf mehrere Pakete, steht es unter betroffene_pakete.

