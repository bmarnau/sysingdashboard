id: A30
titel: 'Plan: lokale Restore-Probe im Docker-Container (R-14, G03, Minimalprobe S1 bis S4)'
art: plan-dann-pr
gate: vor Publish
abhaengig_von: []
ziel: 'Owner-Entscheidung D1 und D1a (2026-11-06): minimale Restore-Probe, Wiederherstellung lokal in einem Docker-Container, Export per lesendem Datenauftrag nach ADR-0037, Ausführung durch den Owner über den Lovable-Connector. Dieser Auftrag liefert nur den Plan und die Entscheidungsvorlage.'
schritte:
- 'Eingänge lesen (Feld eingaenge) und RP-02 (queue/anlagen/RP-02-datenauftrag.txt) prüfen: Ist der Text vollständig, lesend und ohne Geheimnisse? Verbesserungen als Änderungsvorschlag im Plan nennen, die Anlage nicht ändern. Den Auftragstext RP-02 im Plan unter docs/DATENAUFTRAG-RESTORE-PROBE.md (zusammen mit RP-01) ablegen.'
- 'docs/PLAN-RESTORE-PROBE-LOKAL.md: Ziel, Abgrenzung (S5 Domain, Auth-Provider und Hosting lokal nicht belegbar, bleibt dokumentierte Lücke), Umgebung (Docker, Postgres-Version passend zur Live-Datenbank, Supabase lokal oder reines Postgres mit Auth-Schema; Entscheidung begründen), Eingänge (Schema aus supabase/migrations, Daten aus dem Lese-Export), Stufen S1 bis S4 mit Abnahmekriterien (Zeilenzahlen je Tabelle, Stichproben, audit_log vollständig, Auth-Nutzer), Rollenabnahme (App lokal gegen die Probe-Datenbank, Anmeldung je Rolle), Dauer je Schritt, Protokollvorlage für EV-0004.'
- 'Entwurf des lesenden Datenauftrags (ADR-0037): nur SELECT, Tabellenliste, Format, Prüfsummen, keine Geheimnisse. Offen markieren, ob Auth-Nutzer samt Passwort-Hashes exportierbar sind; sonst Konten in der Probe neu anlegen. Den Auftrag führt der Owner aus, Claude Code führt keinen Datenauftrag aus.'
- 'Offene Fragen und Risiken ausweisen: Export von Schema und Auth-Daten aus Lovable Cloud, Versionsunterschiede, Aufwand in Stunden (Gate-Bericht schätzt G03 mit 8 bis 32 Stunden).'
- Bericht reports/A30-BERICHT.md mit Plan, Aufwand, Risiken und Entscheidungsvorlage; Code und Skripte erst nach Freigabe.
- 'Image-Wahl begründen: supabase/postgres mit passendem Tag (Lovable zeigt 17.6.1.147) gegen reines Postgres 17 (supabase_vault, Auth-Schema, Rollen anon, authenticated, service_role). Auth-Konten (9) in der Probe neu anlegen oder nicht, Rollen aus user_roles und profiles zuordnen.'
- 'Vorhandene Werkzeuge prüfen und als Basis nutzen: npm run db:schema:rebuild (supabase db reset --local), db:schema:snapshot, supabase/schema/public-schema.generated.sql und der CI-Job Database Schema Drift. Klären, was davon die Restore-Probe (Struktur aus Migrationen, Vergleich mit Live per RP-02) abdeckt und was fehlt.'
nachweis: Plan-Dokument im Draft-PR (oder im Tagesbündel), Bericht reports/A30-BERICHT.md.
grenzen: Nur Plan. Nichts ausführen, was die Produktion berührt. Keine Zugangsdaten in Dateien. Kein Datenauftrag ausführen, kein Merge, kein Publish. Alle Pfade außerhalb von OneDrive (C:\dev).
status: bereit
eingaenge:
- 'Ergebnis RP-01 (Owner, 2026-11-06 18:21 bis 18:23 UTC, Lovable-Connector, nur SELECT): PostgreSQL 17.6 (Lovable-Anzeige: 17.6.1.147, Europa Irland), Erweiterungen pg_stat_statements 1.11, pgcrypto 1.3, plpgsql 1.0, supabase_vault 0.3.1, uuid-ossp 1.1; 25 Tabellen in public, 302 Spalten, 66 Fremdschlüssel, 21 Unique-, 41 Check-Constraints, 74 Indizes, 41 Trigger, 41 Funktionen, 65 Policies, RLS auf allen 25 Tabellen, kein FORCE RLS; Enums app_role (8 Werte) und user_status (4); profiles 9, user_roles 9, auth.users 9, audit_log 336, shared_activity_projection 47, shared_work_package_projection 20, shared_project_projection 5; Storage 0 Buckets und 0 Objekte; Datenbank 0,27 GB von 2 GB. Der Connector verwies für den Datenexport auf More, Database, Manage, Settings, Export data; der Owner hat den Export am 2026-11-06 abends ausgelöst und lokal unter C:\dev\restore-probe abgelegt (Inhalt, Format und Umfang unbekannt, nicht in Git, nicht in OneDrive).'
- 'Ergebnis RP-01, Migrationen: 30 Einträge in supabase_migrations.schema_migrations, bei 10 ist statements NULL (20260913150000, 20260913174733, 20260914062000, 20260914062100, 20260916052000, 20260916072000, 20260921095742, 20260922185458, 20260927050827, 20260929053733; der Connector nennt fälschlich elf). Vergleich mit supabase/migrations auf main (33 Dateien): nur im Repository, nicht live unter gleichem Namen: 20260913213000_bsf03d_workpackage_category_reference_data, 20260917182000_bsf03a_project_controlling, 20260917190000_bsf03a_preserve_permission_security_invoker, 20261022120000_db_fk_reference_value_history_systemhouse (laut Kopfkommentar auf der Live-Datenbank ein No-Op); nur live: 20260913174733 bsf03d_reference_data_systemhouse_scope (keine Datei im Repository). Folge: Das Schema für die Probe darf nicht allein aus supabase/migrations aufgebaut werden; Gleichheit ist über die Struktur zu belegen (Datenauftrag RP-02, Anlage queue/anlagen/RP-02-datenauftrag.txt, Teil A prüft die Objekte der vier Repo-Migrationen gezielt).'
