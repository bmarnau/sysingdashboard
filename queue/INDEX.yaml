gemeinsame_regeln:
- Sprache Deutsch, sachlich, Anforderungen mit muss/sollte. Daten als JSON oder YAML, Diagramme als Mermaid.
- 'Zu Beginn lesen: docs/CURRENT-STATUS.md, docs/GOLDEN-GATE-EXECUTION-TRACKER.yaml, docs/MERGE-CHECKLISTE-GOLDEN-GATE.md.'
- Kein Merge, kein Publish. Nichts nach main, solange Lovable schreibende Aufträge ausführt. Keine lovable-sync-Branches.
- Keine Zugangsdaten in Dateien oder Commits. audit_log nie löschen. Änderungen am Live-System nur als Datenauftrag nach ADR-0037.
- Aussagen wie 'bestanden' nur mit Beleg (PR, Commit, Testprotokoll, CI-Lauf, Screenshot mit Datum).
- 'Doku-Änderungen eines Tages in einem PR bündeln. Vor Abschluss: Tracker (fortschritt), CURRENT-STATUS, ENTWICKLUNGSTAGEBUCH,
  BACKLOG; npm run docs:check, docs:project, Prettier; pushen und mit git ls-remote prüfen.'
- 'Abschluss jedes Berichts: Hygiene in einer Zeile (gemergte Remote-Branches, offene PRs, Drafts) und YAML-Block mit Reifegrad,
  Projektstatus, Offene_Fragen, Roadmap.'
- 'Hat ein Auftrag das Feld startet_nicht_vor, wird er übersprungen, bis diese Uhrzeit (Europe/Berlin) erreicht ist; ab dann hat er Vorrang vor allen weiteren bereiten Aufträgen.'
